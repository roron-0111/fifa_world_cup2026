name: Refresh player and scorer data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest WFA player and scorer data
        run: npm run refresh:data

      - name: Commit refreshed generated data
        run: |
          if git diff --quiet -- data/players.generated.json project/players.generated.json; then
            echo "No generated player data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.generated.json project/players.generated.json
          git commit -m "Refresh player and scorer data"
          git push

      - name: Deploy Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN is not set. Skipping Firebase Hosting deploy."
            exit 0
          fi
          npx firebase-tools deploy --only hosting --project fifa-world-cup2026 --token "$FIREBASE_TOKEN"
