<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚽ FIFA WORLD CUP 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f2ede4;--s1:#ffffff;--s2:#f7f3ec;--s3:#ebe5d8;
  --accent:#1e6ef0;--accentf:rgba(30,110,240,0.10);
  --gold:#d4960a;--goldf:rgba(212,150,10,0.10);
  --green:#16a34a;--greenf:rgba(22,163,74,0.10);
  --red:#dc2626;
  --text:#1c1e2e;--text2:#7a7886;--border:rgba(0,0,0,0.09);--r:14px;
  --shadow:0 2px 12px rgba(0,0,0,0.08);
}
html,body{background:#ddd8ce;color:var(--text);font-family:'Inter',sans-serif;min-height:100%;overflow:auto;font-size:14px;line-height:1.45;}
#root{min-height:100dvh;display:flex;justify-content:center;align-items:stretch;}
.shell{width:min(100%,1440px);height:100dvh;display:flex;flex-direction:column;position:relative;overflow:visible;background:var(--bg);}
.display{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;}
.page{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:96px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(30,110,240,.38) transparent;}
.page::-webkit-scrollbar{width:8px;}
.page::-webkit-scrollbar-track{background:transparent;}
.page::-webkit-scrollbar-thumb{background:rgba(30,110,240,.38);border-radius:999px;border:2px solid transparent;background-clip:content-box;}
.page-enter{animation:pgIn .3s cubic-bezier(.22,1,.36,1) both;}
@keyframes pgIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
/* AUTH */
.auth-bg{
  width:100%;
  min-height:100%;
  background:
    radial-gradient(circle at 20% 18%, rgba(255,255,255,.62) 0, rgba(255,255,255,0) 34%),
    radial-gradient(circle at 82% 22%, rgba(255,255,255,.38) 0, rgba(255,255,255,0) 28%),
    linear-gradient(155deg,var(--bg) 0%,var(--s3) 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
  padding:28px 20px 108px;
  position:relative;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
.auth-top-title{
  width:100%;
  text-align:center;
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;
  line-height:1;
  letter-spacing:.18em;
  color:var(--text);
  padding-top:2px;
}
.auth-hero{
  position:relative;
  width:min(100%,780px);
  display:flex;
  justify-content:center;
  z-index:1;
}
.auth-brand{
  position:relative;
  width:fit-content;
  max-width:100%;
  aspect-ratio:auto;
  display:grid;
  justify-items:center;
  margin:0 auto;
}
.auth-logo-art{
  width:clamp(280px,34vw,620px);
  max-width:100%;
  height:auto;
  display:block;
  position:relative;
  z-index:1;
}
.auth-overlay{
  position:absolute;
  top:50%;
  width:clamp(120px,13vw,200px);
  height:clamp(120px,13vw,200px);
  background-repeat:no-repeat;
  background-size:contain;
  background-position:center;
  opacity:1;
  pointer-events:none;
  filter:
    drop-shadow(0 0 2px rgba(255,255,255,.9))
    drop-shadow(0 14px 22px rgba(0,0,0,.12));
  z-index:3;
}
.auth-overlay.messi{
  left:calc(50% - clamp(88px, 8vw, 150px));
  transform:translate(-50%, -50%) scale(1.02);
  background-image:url('./messi.png?v=20260419_234500');
}
.auth-overlay.haaland{
  left:calc(50% + clamp(88px, 8vw, 150px));
  transform:translate(-50%, -50%) scale(1.15);
  background-image:url('./Haaland.png?v=20260419_234500');
}
.auth-logo{
  position:relative;
  text-align:center;
}
.auth-title-line{display:none;}
.auth-caption{display:none;}
.wc-chip{display:none;}
.auth-logo h1{display:none;}
.auth-logo h1 .hl{color:var(--accent);}
.auth-logo p{display:none;}
.auth-card{grid-area:card;position:relative;z-index:1;width:100%;max-width:420px;background:var(--s1);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:var(--shadow);}
.auth-tabs{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:22px;}
.atab{flex:1;padding:10px;border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:700;border-radius:7px;cursor:pointer;transition:all .2s;font-family:inherit;}
.atab.on{background:var(--s1);color:var(--text);box-shadow:var(--shadow);}
.guest-help{margin-top:8px;text-align:center;color:var(--text2);font-size:11px;font-weight:800;line-height:1.45;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px;letter-spacing:.5px;}
.field input{width:100%;padding:12px 16px;background:var(--s2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border-color .2s;}
.field input:focus{border-color:var(--accent);}
.field input::placeholder{color:var(--text2);}
.btn{width:100%;padding:14px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:800;border-radius:12px;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:4px;letter-spacing:.3px;}
.btn:hover{opacity:.88;transform:translateY(-1px);}
.btn:active{transform:none;}
.btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text2);font-weight:600;font-size:14px;margin-top:8px;}
.btn.ghost:hover{border-color:var(--text2);color:var(--text);}
.btn.ghost.danger{border-color:var(--red);color:var(--red);}
.btn.ghost.danger:hover{background:var(--red);border-color:var(--red);color:#fff;}
.divlabel{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--text2);font-size:12px;}
.divlabel::before,.divlabel::after{content:'';flex:1;height:1px;background:var(--border);}
.errmsg{color:var(--red);font-size:12px;margin-top:8px;text-align:center;font-weight:600;}
/* NAV */
.bnav{display:flex;background:var(--s1);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,0.06);}
.nitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:color .2s;font-family:inherit;}
.nitem.on{color:var(--accent);}
.nicon{font-size:19px;line-height:1;}
.nlabel{font-size:9px;font-weight:700;letter-spacing:.3px;}
/* HEADER */
.shdr{padding:14px 18px 10px;background:var(--s1);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,0.04);}
.shdr h2{font-size:20px;font-weight:900;}
.shdr p{font-size:11px;color:var(--text2);margin-top:2px;}
/* HOME */
.home-hero{background:var(--accent);padding:24px 18px 20px;position:relative;overflow:hidden;}
.home-hero::before,.home-hero::after{
  content:'';
  position:absolute;
  width:clamp(180px,20vw,280px);
  height:clamp(180px,20vw,280px);
  background-repeat:no-repeat;
  background-size:contain;
  background-position:center;
  opacity:.24;
  pointer-events:none;
  filter:drop-shadow(0 12px 24px rgba(0,0,0,.12));
}
.home-hero::before{left:-46px;bottom:-18px;background-image:url('./messi.png?v=20260419_234500');transform:rotate(-10deg);}
.home-hero::after{right:-42px;top:-10px;background-image:url('./Haaland.png?v=20260419_234500');transform:rotate(10deg);}
.hero-bg-num{position:absolute;right:-10px;top:-20px;font-family:'Bebas Neue';font-size:150px;color:rgba(255,255,255,.08);line-height:1;pointer-events:none;user-select:none;}
.hero-greet{font-size:13px;color:rgba(255,255,255,.7);}
.hero-name{font-size:26px;font-weight:900;color:#fff;margin-top:2px;}
.hero-pts-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch;margin-top:18px;}
.hpc{
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.10));
  border-radius:18px;
  padding:14px 14px 12px;
  text-align:center;
  backdrop-filter:blur(10px) saturate(125%);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 10px 24px rgba(0,0,0,.10);
}
.hpc .n{
  font-family:'Bebas Neue';
  font-size:58px;
  line-height:1;
  color:#fff;
  letter-spacing:1px;
  margin-top:2px;
}
.hpc .l{font-size:10px;color:rgba(255,255,255,.7);font-weight:700;margin-top:2px;text-transform:uppercase;}
.hpc.opp .n{color:var(--gold);}
.hpc-tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:50px;
  padding:4px 10px;
  border-radius:999px;
  background:rgba(255,255,255,.16);
  font-size:11px;
  color:rgba(255,255,255,.9);
  font-weight:900;
  line-height:1;
  letter-spacing:.3px;
  margin-bottom:6px;
}
.hpc-user{
  font-size:14px;
  font-weight:900;
  color:#fff;
  line-height:1.15;
  word-break:break-word;
  min-height:1.15em;
}
.hpc-total{
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:4px;
  line-height:1;
}
.hpc-total .num{font-family:'Bebas Neue';font-size:58px;line-height:1;color:#fff;letter-spacing:1px;}
.hpc-total .unit{font-size:12px;font-weight:900;color:rgba(255,255,255,.86);line-height:1;margin-top:6px;}
.vs-txt{font-family:'Bebas Neue';font-size:26px;color:rgba(255,255,255,.5);text-align:center;align-self:center;display:flex;align-items:center;justify-content:center;height:100%;}
.room-bar{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border-bottom:1px solid var(--border);padding:12px 18px;gap:12px;}
.room-lbl{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.room-code{font-family:'Bebas Neue';font-size:28px;letter-spacing:4px;color:var(--accent);}
.room-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.copy-btn{background:var(--accentf);border:none;color:var(--accent);padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.copy-btn:hover{background:var(--accent);color:#fff;}
.stats-grid{padding:12px 16px;}
.stats-frame{background:var(--s1);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;padding:10px 12px;}
.stats-table{display:flex;flex-direction:column;gap:6px;}
.stats-head,.stats-row{display:grid;grid-template-columns:minmax(52px,.52fr) minmax(88px,1fr) minmax(88px,1fr);gap:8px;align-items:center;}
.stats-head{font-size:10px;color:var(--text2);font-weight:900;letter-spacing:.4px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.stats-head span:nth-child(2),.stats-head span:nth-child(3){text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stats-row{padding:6px 0;border-top:1px solid var(--border);font-size:11px;font-weight:800;color:var(--text2);}
.stats-row:first-of-type{border-top:none;padding-top:0;}
.stats-row span{min-width:0;}
.stats-row b{display:block;text-align:center;font-variant-numeric:tabular-nums;color:var(--text);font-size:13px;}
.stats-row b.me{color:var(--accent);}
.stats-row b.opp{color:var(--gold);}
.stats-row.total b{font-size:14px;}
.info-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin:0 16px 10px;box-shadow:var(--shadow);}
.info-card .itag{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.info-card .ival{font-family:'Inter',sans-serif;font-size:16px;color:var(--accent);font-weight:1000;letter-spacing:-.03em;line-height:1.25;}
.info-card .isub{font-size:11px;color:var(--text2);margin-top:3px;}
.home-status-card{margin:0 14px 12px;background:var(--s1);border:1px solid rgba(22,163,74,.24);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
.home-status-top{padding:14px;background:linear-gradient(135deg,var(--s1),rgba(22,163,74,.08));}
.home-status-divider{height:1px;background:var(--border);}
.pts-info-row{display:flex;gap:8px;padding:0 16px 16px;}
.pts-box{flex:1;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;box-shadow:var(--shadow);}
.pts-box .n{font-family:'Bebas Neue';font-size:30px;line-height:1;}
.pts-box .l{font-size:10px;color:var(--text2);font-weight:700;margin-top:2px;}
.pts-box.grn .n{color:var(--green);}
.pts-box.gold .n{color:var(--gold);}
.home-breakdown{padding:0 14px 18px;}
.home-breakdown-title{font-size:12px;font-weight:900;color:var(--text2);letter-spacing:.4px;text-transform:uppercase;margin:4px 2px 9px;}
.home-breakdown-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.home-break-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:13px;box-shadow:var(--shadow);min-width:0;}
.home-break-card h3{font-size:13px;font-weight:900;margin-bottom:8px;color:var(--text);}
.home-break-totals{display:grid;grid-template-columns:minmax(52px,.52fr) minmax(88px,1fr) minmax(88px,1fr);gap:8px;margin-bottom:8px;}
.home-break-total-spacer{min-width:0;}
.home-break-total{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;text-align:center;border:1px solid var(--border);border-radius:12px;background:var(--s2);padding:8px 6px;}
.home-break-total .total-label{max-width:100%;font-size:10px;color:var(--text2);font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.home-break-total .total-score{display:flex;align-items:baseline;justify-content:center;gap:3px;min-height:42px;}
.home-break-total strong{font-family:'Inter',sans-serif;font-size:38px;line-height:1;color:var(--accent);font-weight:1000;letter-spacing:-.04em;}
.home-break-total.opp strong{color:var(--gold);}
.home-break-total .total-score span{font-size:12px;color:var(--text2);font-weight:900;}
.home-compare{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--text2);font-weight:700;line-height:1.35;}
.home-compare-row{display:grid;grid-template-columns:minmax(52px,.52fr) minmax(88px,1fr) minmax(88px,1fr);align-items:center;gap:8px;border-top:1px solid var(--border);padding-top:5px;}
.home-compare-head{border-top:none;padding-top:0;color:var(--text2);font-size:10px;}
.home-compare-head > b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.home-compare-row > span{justify-self:start;}
.home-compare-row > b{justify-self:center;color:var(--text);font-weight:900;text-align:center;font-variant-numeric:tabular-nums;}
.home-compare-row b.me{color:var(--accent);}
.home-compare-row b.opp{color:var(--gold);}
.result-judge-card{background:transparent;border:none;border-radius:0;box-shadow:none;overflow:hidden;}
.result-judge-head{padding:11px 13px;border-bottom:1px solid var(--border);font-size:13px;font-weight:900;color:var(--green);background:linear-gradient(135deg,var(--s1),rgba(22,163,74,.08));display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.result-judge-head span{display:block;}
.result-judge-head small{display:block;margin-top:3px;font-size:11px;color:var(--text2);font-weight:700;line-height:1.45;}
.result-judge-stamp{font-size:12px;color:var(--green);font-weight:900;}
.result-judge-form{padding:10px 10px 0;display:flex;flex-direction:column;gap:10px;}
.result-judge-btn{width:fit-content;align-self:center;padding:10px 18px;margin-top:0;}
.result-judge-list-head{padding:10px 13px 6px;font-size:12px;font-weight:900;color:var(--text2);}
.result-judge-list{max-height:min(540px,64vh);overflow-y:auto;margin:0 10px 10px;padding:8px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--border);border-radius:14px;background:var(--s2);}
.result-match-item{display:grid;grid-template-columns:minmax(0,1fr) minmax(176px,auto);gap:8px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:8px 10px;background:var(--s1);}
.result-match-main{min-width:0;}
.result-match-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.result-match-code{font-size:12px;font-weight:900;color:var(--green);}
.result-match-time{font-size:11px;color:var(--text2);font-weight:700;}
.result-match-teams{margin-top:4px;font-size:12px;font-weight:800;color:var(--text);line-height:1.35;}
.result-match-side{display:grid;grid-template-columns:auto minmax(56px,1fr) minmax(56px,1fr);align-items:center;justify-items:center;gap:6px;min-width:176px;}
.result-match-score{justify-self:start;font-family:'Bebas Neue';font-size:30px;line-height:1;color:var(--accent);font-weight:900;letter-spacing:-.04em;}
.result-match-score.pending{color:var(--text2);}
.result-match-judge-col{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;width:100%;}
.result-match-judge-label{max-width:100%;font-size:9px;font-weight:900;color:var(--text2);line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.result-pred-score{font-family:'Bebas Neue';font-size:15px;line-height:1;color:var(--text);font-weight:900;letter-spacing:.02em;}
.result-match-judge-col .match-status-badge{max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.result-match-empty{padding:12px;color:var(--text2);font-size:12px;font-weight:700;}
.match-status-badge,.ko-match-status{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:68px;
  padding:4px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  line-height:1;
  letter-spacing:.2px;
  white-space:nowrap;
}
.match-status-badge.pending,.ko-match-status.pending{background:rgba(100,116,139,.12);color:#64748b;}
.match-status-badge.hit,.ko-match-status.hit{background:var(--greenf);color:var(--green);}
.match-status-badge.miss,.ko-match-status.miss{background:rgba(220,38,38,.10);color:var(--red);}
.guest-notice{margin:12px 14px 0;padding:14px;border-radius:18px;background:linear-gradient(135deg,#0f172a,#1e6ef0 58%,#d4960a);color:#fff;box-shadow:0 16px 36px rgba(15,23,42,.22);display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid rgba(255,255,255,.22);}
.guest-notice strong{display:block;font-size:14px;font-weight:900;margin-bottom:4px;}
.guest-notice span{display:block;font-size:12px;line-height:1.55;font-weight:800;color:rgba(255,255,255,.88);}
/* GROUPS */
.gtabs-scroll{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--s1);}
.gtabs-scroll{position:sticky;top:56px;z-index:30;backdrop-filter:saturate(1.1) blur(8px);}
.gtabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;width:100%;}
.gtab{padding:7px 4px;background:var(--s2);border:none;border-radius:100px;color:var(--text2);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s;flex:0 0 auto;}
.gtab.on{background:var(--accent);color:#fff;}
.standings{
  margin:6px 0 0;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  background:var(--s1);
  box-shadow:var(--shadow);
}
.sth{display:grid;grid-template-columns:24px minmax(112px,1.25fr) repeat(8,minmax(0,.82fr));gap:4px;padding:9px 10px;background:var(--s2);font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;align-items:center;border-bottom:1px solid var(--border);}
.str{display:grid;grid-template-columns:24px minmax(112px,1.25fr) repeat(8,minmax(0,.82fr));gap:4px;padding:9px 10px;background:var(--s1);border-top:1px solid var(--border);align-items:center;font-size:12px;}
.str.qual{background:linear-gradient(90deg,rgba(51,124,255,.14),rgba(51,124,255,.06));box-shadow:inset 3px 0 0 rgba(51,124,255,.85);}
.str.rank-confirmed{background:linear-gradient(90deg,rgba(14,165,90,.18),rgba(14,165,90,.06));box-shadow:inset 3px 0 0 rgba(14,165,90,.9);}
.str.qual:hover{background:linear-gradient(90deg,rgba(51,124,255,.18),rgba(51,124,255,.08));}
.str.rank-confirmed:hover{background:linear-gradient(90deg,rgba(14,165,90,.22),rgba(14,165,90,.08));}
.str:hover{background:var(--accentf);}
.str .pos{color:var(--text2);font-weight:700;font-size:11px;text-align:center;}
.str .team-n{display:flex;align-items:center;gap:6px;font-weight:700;min-width:0;}
.str .team-n .flag-ico{flex-shrink:0;}
.str .team-name{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(8px,1vw,12px);line-height:1.15;letter-spacing:-.01em;}
.qual-badge{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;min-width:18px;border-radius:999px;background:rgba(51,124,255,.14);color:#1e6ef0;border:1px solid rgba(51,124,255,.24);padding:0;font-size:10px;font-weight:1000;line-height:1;white-space:nowrap;}
.qual-badge.rank{background:rgba(14,165,90,.14);color:#0f8f52;border-color:rgba(14,165,90,.28);}
.str .sv{text-align:center;color:var(--text2);font-size:12px;}
.str .pts-v{text-align:center;font-weight:900;font-size:15px;color:var(--accent);}
.qi{width:3px;height:18px;border-radius:2px;flex-shrink:0;}
.flag-ico{width:18px;height:12px;object-fit:cover;border-radius:2px;display:inline-block;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.08);}
.flag-fallback{display:inline-flex;align-items:center;justify-content:center;min-width:18px;min-height:12px;line-height:1;}
.flag-duo{display:inline-flex;align-items:center;gap:2px;vertical-align:middle;}
.flag-duo .flag-ico{width:15px;height:10px;}
/* Match cards */
.mcard{
  background:var(--s1);
  border:1px solid var(--border);
  border-radius:16px;
  margin:0 0 10px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.mcard-hdr{padding:9px 12px 6px;background:var(--s2);font-size:10px;color:var(--text2);font-weight:700;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;}
.mcard-hdr-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.mcard-body{padding:4px 8px 6px;}
.mteams{display:grid;grid-template-columns:minmax(0,.9fr) clamp(34px,6vw,48px) minmax(0,.9fr);align-items:center;gap:0;}
.mteams{padding:4px 0 0;}
.mt{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  text-align:center;
  justify-self:center;
  min-height:44px;
  width:min(100%,136px);
  margin:0 auto;
}
.mteams > .mt:first-child{justify-self:end;margin-right:1px;}
.mteams > .mt:last-child{justify-self:start;margin-left:1px;}
.mt .fl{display:flex;align-items:center;justify-content:center;height:clamp(18px,3vw,25px);min-height:clamp(18px,3vw,25px);margin-bottom:2px;}
.mt .fl .flag-ico{width:clamp(32px,6vw,46px);height:clamp(19px,3.8vw,27px);}
.mt .nm{
  font-size:clamp(12px,2.9vw,14px);
  font-weight:900;
  line-height:1.2;
  max-width:100%;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
  white-space:normal;
  min-height:1.35em;
}
.result-display{justify-self:center;min-width:clamp(40px,6vw,54px);padding:0;gap:2px;align-self:center;margin-bottom:0;transform:translateY(-1px);}
.score-ctrl{display:flex;align-items:center;gap:8px;}
.scw{display:flex;flex-direction:column;align-items:center;gap:3px;}
.sarr{width:30px;height:22px;border:none;background:var(--s2);color:var(--text2);border-radius:5px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.sarr:hover{background:var(--accent);color:#fff;}
.snum{width:46px;height:46px;background:var(--s2);border:1.5px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:30px;color:var(--text);transition:all .2s;}
.snum.active{border-color:var(--accent);background:var(--accentf);color:var(--accent);}
.sdiv{font-family:'Bebas Neue';font-size:22px;color:var(--text2);}
/* Locked state */
.locked-display{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;}
.locked-score{font-family:'Bebas Neue';font-size:38px;color:var(--accent);letter-spacing:2px;}
.locked-dash{font-family:'Bebas Neue';font-size:28px;color:var(--text2);}
.result-display{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-width:128px;
  padding:4px 6px;
}
.result-score{
  font-family:'Bebas Neue';
  font-size:34px;
  line-height:1;
  color:var(--accent);
  letter-spacing:1px;
}
.result-dash{
  font-family:'Bebas Neue';
  font-size:24px;
  color:var(--text2);
  padding:0 4px;
}
.lock-tag{display:inline-flex;align-items:center;gap:3px;background:var(--accentf);color:var(--accent);font-size:9px;font-weight:800;padding:2px 8px;border-radius:18px;letter-spacing:.2px;white-space:nowrap;}
.match-finished-tag{display:inline-flex;align-items:center;justify-content:center;background:var(--greenf);color:var(--green);font-size:10px;font-weight:900;padding:3px 10px;border-radius:999px;line-height:1;white-space:nowrap;}
.mactions{margin-top:10px;display:flex;gap:6px;align-items:center;}
.pbtn{flex:1;padding:8px 7px;background:var(--accent);border:none;color:#fff;font-size:11px;font-weight:800;border-radius:10px;cursor:pointer;font-family:inherit;transition:all .2s;letter-spacing:.15px;min-width:0;}
.pbtn:hover{opacity:.88;}
.ubtn{flex:1;padding:8px 7px;background:var(--s2);border:1.5px solid var(--border);color:var(--text2);font-size:11px;font-weight:800;border-radius:10px;cursor:pointer;font-family:inherit;transition:all .2s;letter-spacing:.15px;min-width:0;}
.ubtn:hover{border-color:var(--red);color:var(--red);}
.readonly-note{width:100%;padding:8px 10px;border:1px dashed var(--border);border-radius:10px;background:var(--s2);color:var(--text2);font-size:11px;font-weight:800;text-align:center;}
/* Admin result entry (visible to admin in match card) */
.admin-result{border-top:1px dashed var(--border);margin-top:12px;padding-top:10px;}
.adm-tag{font-size:9px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.adm-score-row{display:flex;align-items:center;gap:8px;}
.adm-si{width:52px;padding:7px;background:var(--s2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:18px;font-family:'Bebas Neue';text-align:center;outline:none;transition:border-color .2s;}
.adm-si:focus{border-color:var(--gold);}
.adm-dash{font-family:'Bebas Neue';font-size:18px;color:var(--text2);}
.adm-save{padding:7px 16px;background:var(--gold);border:none;color:#fff;font-size:11px;font-weight:800;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .15s;margin-left:auto;}
.adm-save:hover{opacity:.85;}
/* BRACKET */
.bkt-round-tabs{overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--s1);scrollbar-width:none;}
.bkt-round-tabs::-webkit-scrollbar{display:none;}
.bkt-rtabs{display:flex;gap:6px;width:max-content;}
.brtab{padding:7px 16px;background:var(--s2);border:none;border-radius:100px;color:var(--text2);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap;}
.brtab.on{background:var(--accent);color:#fff;}
/* Bracket tree for SF/Final */
.bracket-tree{padding:16px 14px 48px;display:flex;flex-direction:column;gap:14px;align-items:stretch;}
.bracket-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start;}
.bracket-grid.lower{grid-template-columns:repeat(3,minmax(0,1fr));}
.bkt-final-section{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:12px;}
.bkt-sf-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;padding:0 14px;}
.bkt-end-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;padding:0 14px;align-items:start;}
.bkt-match-card{flex:1;background:var(--s1);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
.bkt-match-card.final-card{border-color:var(--gold);box-shadow:0 4px 20px rgba(212,150,10,.15);}
.bkt-match-title{padding:6px 10px;background:var(--s2);font-size:9px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.bkt-match-card.final-card .bkt-match-title{background:var(--goldf);color:var(--gold);}
.bkt-team-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--border);cursor:pointer;transition:all .2s;}
.bkt-team-row:last-child{border-bottom:none;}
.bkt-team-row:hover{background:var(--s2);}
.bkt-team-row.sel{background:var(--accentf);border-left:3px solid var(--accent);}
.bkt-team-row .bfl{font-size:18px;}
.bkt-team-row .bnm{flex:1;font-size:12px;font-weight:700;line-height:1.2;}
.bkt-team-row .bchk{font-size:12px;color:var(--accent);font-weight:800;}
.connector{display:flex;align-items:center;justify-content:center;height:32px;position:relative;}
.connector::before{content:'▼';font-size:16px;color:var(--text2);}
/* List bracket */
.bkt-list{margin:10px 14px;display:flex;flex-direction:column;gap:8px;}
.bkt-match-list{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
.bkt-list-hdr{padding:7px 12px;background:var(--s2);font-size:10px;font-weight:700;color:var(--text2);display:flex;justify-content:space-between;}
.bkt-list-team{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.bkt-list-team:last-child{border-bottom:none;}
.bkt-list-team:hover{background:var(--s2);}
.bkt-list-team.sel{background:var(--accentf);}
.bkt-list-team .lfl{font-size:18px;}
.bkt-list-team .lnm{flex:1;font-size:13px;font-weight:700;}
.bkt-list-team .lchk{color:var(--accent);font-weight:800;font-size:13px;}
/* LEADERBOARD */
.lb-hero{background:var(--accent);padding:20px 18px;position:relative;overflow:hidden;}
.lb-bg-txt{position:absolute;right:-5px;bottom:-20px;font-family:'Bebas Neue';font-size:90px;color:rgba(255,255,255,.08);pointer-events:none;user-select:none;}
.lb-label{font-size:10px;color:rgba(255,255,255,.6);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.lb-vs-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:14px;}
.lb-pl{text-align:center;}
.lb-pl-name{font-size:13px;font-weight:800;margin-bottom:3px;color:rgba(255,255,255,.8);}
.lb-pl-pts{font-family:'Bebas Neue';font-size:56px;line-height:1;color:#fff;}
.lb-top-player-name{font-size:12px;font-weight:800;line-height:1.2;color:rgba(255,255,255,.72);margin-top:4px;}
.lb-opp .lb-pl-pts{color:var(--gold);}
.lb-vs-txt{font-family:'Bebas Neue';font-size:26px;color:rgba(255,255,255,.4);text-align:center;}
.lb-bar-wrap{margin-top:12px;height:6px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden;}
.lb-bar-fill{height:100%;background:rgba(255,255,255,.7);border-radius:10px;transition:width .6s ease;}
.lb-list{margin:0 14px;}
.lb-row{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.lb-row:last-child{border-bottom:none;}
.scorer-data-note{margin:4px 18px 0;padding:0 2px;font-size:9px;font-weight:700;line-height:1.35;color:rgba(122,120,134,.74);}
.pred-cell{text-align:center;}
.pred-sc{font-family:'Bebas Neue';font-size:22px;line-height:1;}
.pred-sc.me-c{color:var(--accent);}
.pred-sc.opp-c{color:var(--gold);}
.pred-pts-tag{display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;border-radius:10px;margin-top:2px;text-transform:uppercase;letter-spacing:.3px;}
.pts-exact{background:var(--goldf);color:var(--gold);}
.pts-result{background:var(--greenf);color:var(--green);}
.pts-none{background:rgba(100,100,100,.1);color:var(--text2);}
.match-mid{font-size:10px;color:var(--text2);text-align:center;line-height:1.5;}
.actual-r{font-family:'Bebas Neue';font-size:14px;color:var(--accent);display:block;margin-top:2px;}
.scorer-pred-panel{margin:14px;background:var(--s1);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;}
.scorer-pred-summary{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:12px;cursor:pointer;list-style:none;}
.scorer-pred-summary::-webkit-details-marker{display:none;}
.scorer-pred-summary-title{display:flex;flex-direction:column;gap:2px;min-width:0;}
.scorer-pred-summary-title strong{font-size:13px;font-weight:900;color:var(--text);}
.scorer-pred-summary-title span{font-size:10px;font-weight:800;color:var(--text2);}
.scorer-pred-counts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.scorer-pred-counts span{display:inline-flex;align-items:center;gap:3px;border-radius:999px;background:var(--s2);border:1px solid var(--border);padding:4px 8px;font-size:10px;font-weight:900;color:var(--text2);white-space:nowrap;}
.scorer-pred-counts b{color:var(--accent);}
.scorer-pred-caret{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:5px 8px;border-radius:999px;background:var(--accentf);color:var(--accent);font-size:10px;font-weight:900;}
.scorer-pred-caret::before{content:'開く';}
.scorer-pred-panel[open] .scorer-pred-caret::before{content:'閉じる';}
.scorer-pred-panel:not([open]) .scorer-pred-body{display:none;}
.scorer-pred-body{border-top:1px solid var(--border);padding:9px 12px 12px;background:linear-gradient(180deg,#fff,var(--s2));}
.scorer-pred-grid{display:grid;grid-template-columns:1fr;gap:6px;}
.scorer-pred-card{min-width:0;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.72);padding:6px;display:grid;grid-template-columns:minmax(44px,.22fr) minmax(0,1fr);gap:6px;align-items:center;}
.scorer-pred-card.hit{border-color:rgba(22,163,74,.32);box-shadow:0 0 0 3px var(--greenf) inset;}
.scorer-pred-head{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;font-size:10px;font-weight:900;color:var(--text2);min-width:0;}
.scorer-pred-head b{color:var(--accent);white-space:nowrap;}
.scorer-pred-controls{display:grid;grid-template-columns:minmax(104px,.46fr) minmax(0,1.54fr);gap:5px;min-width:0;}
.scorer-select{width:100%;min-width:0;border:1.5px solid var(--border);border-radius:10px;background:var(--s1);color:var(--text);font:inherit;font-size:11px;font-weight:800;padding:7px 8px;outline:none;}
.scorer-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentf);}
.scorer-select:disabled{opacity:.65;}
.scorer-pred-note{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center;font-size:10px;color:var(--text2);font-weight:800;line-height:1.35;}
.scorer-pred-note span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.scorer-pred-note strong{width:fit-content;border-radius:999px;background:rgba(100,100,100,.08);color:var(--text2);padding:3px 8px;font-size:10px;}
.scorer-pred-card.hit .scorer-pred-note strong{background:var(--greenf);color:var(--green);}
.scorer-pred-help{margin-top:8px;font-size:10px;color:var(--text2);font-weight:700;line-height:1.45;}
/* SETTINGS */
.set-sec{margin:14px 14px 20px;}
.set-sec h3{font-size:14px;font-weight:900;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);}
.set-row:last-child{border-bottom:none;}
.settings-save-row{border-bottom:none;padding-top:10px;justify-content:flex-start;gap:10px;align-items:center;flex-wrap:nowrap;}
.settings-save-btn{width:auto;min-width:72px;flex:0 0 auto;padding:10px 18px;white-space:nowrap;word-break:keep-all;}
.sl{font-size:14px;font-weight:700;}
.sl span{font-size:11px;color:var(--text2);display:block;font-weight:500;margin-top:2px;}
.pts-ctrl{display:flex;align-items:center;gap:10px;}
.pts-val{font-family:'Bebas Neue';font-size:32px;color:var(--accent);width:44px;text-align:center;}
.ptsbtn{width:34px;height:34px;border:1.5px solid var(--border);background:var(--s2);color:var(--text);border-radius:9px;font-size:18px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.ptsbtn:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
/* Toggle switch */
.toggle{position:relative;width:44px;height:24px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.tslider{position:absolute;inset:0;background:var(--s3);border-radius:100px;cursor:pointer;transition:background .2s;}
.tslider::after{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.2);}
.toggle input:checked+.tslider{background:var(--accent);}
.toggle input:checked+.tslider::after{transform:translateX(20px);}
/* BG theme picker */
.bg-picker{display:flex;gap:8px;flex-wrap:wrap;}
.bg-swatch{width:36px;height:36px;border-radius:8px;cursor:pointer;border:2.5px solid transparent;transition:all .15s;position:relative;}
.bg-swatch.on{border-color:var(--accent);}
.bg-swatch.on::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--text);}
/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:9px 18px;border-radius:100px;z-index:999;animation:toastIn .3s ease;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.15);}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* Empty */
.empty{text-align:center;padding:60px 20px;}
.empty .ico{font-size:48px;margin-bottom:14px;}
.empty h3{font-size:18px;font-weight:900;margin-bottom:8px;}
.empty p{font-size:13px;color:var(--text2);line-height:1.6;}
/* Tweaks panel */
.tweaks-panel{position:fixed;bottom:80px;right:14px;z-index:200;background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:16px;width:230px;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:pgIn .3s ease;}
.tweaks-panel h4{font-size:13px;font-weight:800;margin-bottom:12px;}
.tw-row{margin-bottom:10px;}
.tw-lbl{font-size:11px;color:var(--text2);font-weight:700;margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.3px;}
.tw-opts{display:flex;gap:5px;flex-wrap:wrap;}
.tw-opt{padding:5px 12px;border:1.5px solid var(--border);border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;background:var(--s2);color:var(--text2);transition:all .15s;font-family:inherit;}
.tw-opt.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.section-title{padding:14px 16px 6px;font-size:11px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:300;display:flex;align-items:flex-end;justify-content:center;padding:16px;}
.modal-card{width:min(100%,560px);max-height:86vh;overflow-x:hidden;overflow-y:auto;background:var(--s1);border:1px solid var(--border);border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.25);padding:16px;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px;}
.modal-kicker{font-size:10px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.modal-head h3{font-size:20px;font-weight:900;line-height:1.1;}
.modal-close{border:1px solid var(--border);background:var(--s2);color:var(--text2);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;}
.modal-sub{font-size:12px;color:var(--text2);margin-bottom:12px;}
.player-filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px;}
.player-filter-chip{border:1.5px solid var(--border);background:var(--s2);color:var(--text2);border-radius:999px;padding:7px 11px;font:inherit;font-size:11px;font-weight:900;cursor:pointer;line-height:1;transition:all .15s;}
.player-filter-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.player-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.player-row{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border:1px solid var(--border);border-radius:14px;background:var(--s2);cursor:pointer;transition:all .15s;}
.player-row:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentf);}
.player-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.player-main{min-width:0;flex:1;}
.player-name{font-size:clamp(12px,2.5vw,14px);font-weight:900;line-height:1.18;word-break:break-word;}
.player-meta{font-size:clamp(9px,2.4vw,11px);color:var(--text2);margin-top:5px;line-height:1.35;}
.player-meta-line{display:block;word-break:break-word;}
.player-detail-grid{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.15fr);gap:4px 8px;align-items:center;}
.player-club-line{grid-column:3;justify-self:end;text-align:right;}
.pos-badge{display:inline-flex;align-items:center;justify-content:center;width:34px;padding:3px 0;border-radius:999px;font-size:10px;font-weight:1000;line-height:1;color:#fff;letter-spacing:.4px;}
.pos-badge.gk{background:#dc2626;}
.pos-badge.df{background:#2563eb;}
.pos-badge.mf{background:#d97706;}
.pos-badge.fw{background:#ef4444;}
.pos-badge.unknown{background:#64748b;}
.player-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.player-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;background:var(--accentf);color:var(--accent);}
.player-badge.dim{background:var(--s1);color:var(--text2);}
.player-row.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentf);}
.player-editor{padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--s1);margin-bottom:12px;}
.player-editor-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.player-editor-title{font-size:13px;font-weight:900;color:var(--text);}
.player-editor-note{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.45;}
.player-select{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:10px;background:var(--s2);font:inherit;color:var(--text);outline:none;}
.player-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentf);}
.player-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0;}
.player-edit.full{margin-top:12px;}
.player-field{display:flex;flex-direction:column;gap:4px;min-width:0;}
.player-field label{font-size:10px;color:var(--text2);font-weight:800;text-transform:uppercase;letter-spacing:.4px;}
.player-field input,.player-field select,.player-field textarea{width:100%;min-width:0;padding:9px 10px;border:1.5px solid var(--border);border-radius:10px;background:var(--s1);font:inherit;color:var(--text);outline:none;max-width:100%;}
.player-field textarea{resize:vertical;line-height:1.5;}
.player-field input:focus,.player-field select:focus,.player-field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentf);}
.player-edit-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.player-mini-btn{
  min-width:0;
  padding:8px 12px;
  border:1.5px solid var(--border);
  border-radius:10px;
  background:var(--s2);
  color:var(--text2);
  font:inherit;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  transition:all .15s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.player-mini-btn:hover{border-color:var(--accent);color:var(--accent);}
.player-mini-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.player-mini-btn.primary:hover{opacity:.92;color:#fff;}
.player-mini-btn.danger{background:transparent;border-color:var(--red);color:var(--red);}
.player-mini-btn.danger:hover{background:var(--red);color:#fff;}
.player-mini-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}
.room-hero-score{display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:space-between;min-height:150px;}
.auth-recent{margin:8px 0 0;padding:8px;border:1px solid var(--border);border-radius:12px;background:var(--s2);}
.auth-recent-title{font-size:10px;color:var(--text2);font-weight:900;margin-bottom:5px;}
.auth-recent-list{display:flex;flex-direction:column;gap:5px;max-height:68px;overflow-y:auto;padding-right:2px;}
.auth-recent-btn{width:100%;border:1px solid var(--border);background:var(--s1);border-radius:9px;padding:6px 8px;text-align:left;font:inherit;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;}
.auth-recent-btn strong,.auth-recent-btn span{font-size:10px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.auth-recent-btn strong{color:var(--text);}
.auth-recent-btn span{color:var(--accent);letter-spacing:.4px;}
.member-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;padding:12px 16px 0;}
.member-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);}
.member-card.me{border-color:var(--accent);}
.member-card .mc-name{font-size:13px;font-weight:900;color:var(--text);}
.member-card .mc-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px;}
.member-card .mc-total{display:flex;align-items:baseline;gap:3px;line-height:1;}
.member-card .mc-total-num{font-family:'Bebas Neue';font-size:36px;color:var(--accent);}
.member-card .mc-unit{font-size:12px;color:var(--text2);font-weight:800;}
.member-card .mc-pred{font-size:11px;color:var(--text2);font-weight:700;}
.member-card .mc-break{font-size:11px;color:var(--text2);font-weight:700;width:100%;line-height:1.4;}
.member-card .mc-break strong{color:var(--text);}
.pred-compare{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:3px;
  margin-top:0;
}
.pred-box{
  background:linear-gradient(180deg,rgba(255,255,255,.84),rgba(250,248,243,.94));
  border:1px solid var(--border);
  border-radius:14px;
  padding:6px 7px 5px;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px;
  justify-content:space-between;
  box-shadow:0 6px 16px rgba(0,0,0,.05);
}
.pred-box.me{background:linear-gradient(180deg,rgba(30,110,240,.11),rgba(30,110,240,.06));border-color:rgba(30,110,240,.26);}
.pred-box.opp{
  background:linear-gradient(180deg,rgba(212,150,10,.11),rgba(212,150,10,.06));
  border-color:rgba(212,150,10,.26);
  justify-content:flex-start;
  min-height:100%;
}
.pred-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;}
.pred-role{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:40px;
  padding:3px 8px;
  border-radius:999px;
  font-size:9px;
  font-weight:900;
  letter-spacing:.2px;
  line-height:1;
  color:#fff;
  background:var(--text2);
  border:1px solid transparent;
  flex:0 0 auto;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.pred-box.me .pred-role{background:var(--accent);}
.pred-box.opp .pred-role{background:var(--gold);}
.pred-name{
  flex:1;
  min-width:0;
  font-size:12px;
  font-weight:900;
  color:var(--text);
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:right;
}
.pred-score{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-width:0;
  text-align:center;
  margin-top:auto;
  margin-bottom:auto;
}
.pred-score > div{
  flex:1;
  min-width:0;
  text-align:center;
}
.pred-value{
  font-family:'Bebas Neue';
  font-size:30px;
  line-height:1;
  color:var(--text);
  letter-spacing:1px;
}
.pred-value.big{
  font-size:38px;
  color:var(--accent);
}
.pred-value.no-pred{
  font-family:'Inter',sans-serif;
  font-size:15px;
  line-height:1.2;
  letter-spacing:0;
  font-weight:900;
  color:var(--text2);
  white-space:normal;
  word-break:keep-all;
  overflow-wrap:anywhere;
}
.pred-value.big.no-pred{
  font-size:16px;
  color:var(--text2);
}
.prediction-point-tag{
  font-size:11px;
  font-weight:900;
  padding:6px 10px;
  border-radius:10px;
  white-space:nowrap;
  line-height:1;
}
.prediction-point-tag.exact{background:var(--goldf);color:var(--gold);}
.prediction-point-tag.result{background:var(--greenf);color:var(--green);}
.prediction-point-tag.miss{background:rgba(100,100,100,.08);color:var(--text2);}
.pred-note{
  font-size:10px;
  color:var(--text2);
  font-weight:700;
  line-height:1.2;
  text-align:center;
}
.pred-edit{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  flex-wrap:nowrap;
  padding-top:2px;
  margin-top:auto;
  margin-bottom:auto;
}
.pred-edit .snum{width:42px;height:42px;font-size:27px;border-radius:10px;}
.pred-edit .sarr{width:26px;height:20px;font-size:11px;border-radius:5px;}
.pred-edit .sdiv{font-size:18px;}
.timezone-select{display:flex;gap:6px;flex-wrap:wrap;}
.timezone-chip{padding:8px 12px;border:1.5px solid var(--border);border-radius:999px;background:var(--s1);color:var(--text2);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:112px;line-height:1.1;}
.timezone-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.tz-main{font-size:12px;font-weight:800;}
.tz-sub{font-size:10px;font-weight:700;opacity:.85;letter-spacing:.2px;}
@media (max-width: 520px){
  .auth-top-title{font-size:18px;letter-spacing:.14em;}
  .home-breakdown-grid{grid-template-columns:1fr;}
  .result-match-item{grid-template-columns:1fr;gap:7px;padding:9px;}
  .result-match-main{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;align-items:start;}
  .result-match-head{align-content:flex-start;gap:4px;}
  .result-match-teams{font-size:13px;line-height:1.25;margin-top:0;overflow-wrap:anywhere;}
  .result-match-side{grid-template-columns:minmax(58px,.52fr) repeat(2,minmax(0,1fr));width:100%;min-width:0;gap:6px;align-items:center;}
  .result-match-score{font-size:34px;justify-self:center;}
  .result-match-judge-col .match-status-badge{width:100%;max-width:none;min-width:0;padding:4px 5px;font-size:9px;}
  .guest-notice{align-items:flex-start;flex-direction:column;}
  .player-edit-grid{grid-template-columns:1fr;}
  .player-editor{padding:10px;}
  .player-name{font-size:11px;}
  .player-meta{font-size:9px;}
  .player-list{gap:6px;}
  .player-row{padding:10px;}
  .player-mini-btn,.btn.ghost,.modal-close{font-size:11px;}
  .scorer-pred-grid{grid-template-columns:1fr;}
  .scorer-pred-card{padding:6px;}
  .scorer-select{font-size:12px;padding:9px 8px;}
  .rank-card{padding:10px;}
  .rank-card-top{grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;}
  .rank-card-name{font-size:13px;}
  .rank-card-meta{margin-top:4px;gap:4px;}
  .rank-score{font-size:30px;}
  .rank-score-sub{text-align:right;}
}

/* RANKING */
.rank-tabs{display:flex;gap:8px;padding:10px 14px 0;flex-wrap:wrap;}
.rank-tab{padding:8px 14px;border:1.5px solid var(--border);border-radius:999px;background:var(--s1);color:var(--text2);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;}
.rank-tab.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.rank-list{display:flex;flex-direction:column;gap:8px;margin:0 14px 14px;}
.rank-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:12px;box-shadow:var(--shadow);}
.rank-card-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;}
.rank-card-left{min-width:0;flex:1;}
.rank-card-rank{font-family:'Inter',sans-serif;font-size:20px;line-height:1;color:var(--accent);font-weight:1000;letter-spacing:-.04em;}
.rank-card-name{font-size:14px;font-weight:900;line-height:1.25;}
.rank-card-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:10px;color:var(--text2);}
.rank-pos{display:inline-flex;align-items:center;justify-content:center;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:1000;line-height:1;color:#fff;letter-spacing:.3px;}
.rank-pos.gk{background:#dc2626;}
.rank-pos.df{background:#2563eb;}
.rank-pos.mf{background:#d97706;}
.rank-pos.fw{background:#ef4444;}
.rank-pos.unknown{background:#64748b;}
.rank-card-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--text2);}
.rank-score{font-family:'Bebas Neue';font-size:34px;line-height:1;color:var(--accent);}
.rank-score-sub{font-size:10px;color:var(--text2);margin-top:2px;text-align:right;}
.rank-tools{display:flex;gap:8px;align-items:center;padding:10px 14px 0;flex-wrap:wrap;}
.rank-search{flex:1;min-width:180px;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--s1);font:inherit;color:var(--text);outline:none;}
.rank-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentf);}
@media (min-width: 768px){
  .mt{margin:0;width:min(100%,152px);}
  .mteams > .mt:first-child{justify-self:center;}
  .mteams > .mt:last-child{justify-self:center;}
}
@media (max-width: 767px){
  .mcard-body{padding:4px 8px 6px;}
  .mt{
    width:min(100%,128px);
    margin:0;
  }
  .mteams > .mt:first-child{
    justify-self:center;
    margin-left:0;
  }
  .mteams > .mt:last-child{
    justify-self:center;
    margin-right:0;
  }
  .mt .fl{margin-bottom:2px;}
  .mt .nm{font-size:clamp(12px,2.9vw,14px);}
}
.filter-wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%;padding-bottom:2px;}
.filter-wrap::-webkit-scrollbar{display:none;}
.filter-chip{flex:0 0 auto;padding:8px 12px;border:1.5px solid var(--border);border-radius:100px;background:var(--s1);color:var(--text2);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
.filter-chip.on{border-color:var(--accent);background:var(--accentf);color:var(--accent);}
.rank-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 14px 0;font-size:11px;color:var(--text2);}
.rank-country{border:1px solid var(--border);background:var(--accentf);color:var(--accent);border-radius:999px;padding:6px 10px;font:inherit;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
.rank-country:hover{filter:brightness(.97);}
.point-sec .set-row{max-width:760px;}
.point-sec .pts-ctrl{margin-left:auto;}
@media (min-width: 920px){
  .sth,.str{grid-template-columns:28px minmax(180px,1.7fr) repeat(8,minmax(0,1fr));}
}

/* BRACKET */
.bracket-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px 14px 18px;overflow:hidden;}
.bracket-col{display:flex;flex-direction:column;gap:8px;min-width:0;}
.bracket-col-hdr{padding:8px 12px;border-radius:12px;background:var(--accent);color:#fff;font-size:12px;font-weight:900;letter-spacing:.4px;box-shadow:var(--shadow);}
.bracket-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
.bracket-card.final{border-color:var(--gold);box-shadow:0 4px 16px rgba(212,150,10,.15);}
.bracket-card.compact .bracket-team{padding:8px 10px;}
.bracket-card.compact .bracket-name{font-size:10px;}
.bracket-card-hdr{padding:7px 10px;background:var(--s2);font-size:9px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;}
.bracket-card.final .bracket-card-hdr{background:var(--goldf);color:var(--gold);}
.bracket-summary{padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.45);}
.bracket-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:100px;font-size:10px;font-weight:800;background:var(--s2);color:var(--text2);}
.bracket-pill.on{background:var(--accentf);color:var(--accent);}
.bracket-pill.gold.on{background:var(--goldf);color:var(--gold);}
.bracket-team{display:flex;align-items:center;gap:8px;padding:10px 10px;border-top:1px solid var(--border);cursor:pointer;transition:background .15s;}
.bracket-team:first-of-type{border-top:none;}
.bracket-team:hover{background:var(--s2);}
.bracket-team.on{background:var(--accentf);border-left:3px solid var(--accent);}
.bracket-team.resolved{background:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,0));}
.bracket-team.winner{background:var(--goldf);border-left:3px solid var(--gold);}
.bracket-fl{font-size:18px;line-height:1;}
.bracket-name{flex:1;font-size:12px;font-weight:800;line-height:1.25;min-width:0;}
.bracket-check{font-size:12px;color:var(--accent);font-weight:900;}
.bracket-team.winner .bracket-check{color:var(--gold);}

/* KNOCKOUT BOARD */
.ko-toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px 14px 0;}
.ko-zoom-toggle{position:fixed;right:16px;bottom:72px;z-index:330;display:inline-flex;align-items:center;justify-content:center;width:max-content;min-width:62px;max-width:88px;white-space:nowrap;box-sizing:border-box;border:1.5px solid var(--accent);background:linear-gradient(135deg,var(--accent),#0f4cc4);color:#fff;border-radius:999px;padding:12px 16px;font:inherit;font-size:13px;line-height:1;font-weight:1000;cursor:pointer;box-shadow:0 14px 34px rgba(30,110,240,.32);}
.ko-summary-card{background:linear-gradient(135deg,var(--s1),var(--s2));border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0;position:relative;overflow:hidden;}
.ko-summary-card::after{content:'';position:absolute;right:-28px;top:-34px;width:92px;height:92px;border-radius:999px;background:var(--accentf);pointer-events:none;}
.ko-summary-card span{font-size:10px;font-weight:900;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;}
.ko-summary-card strong{font-family:'Bebas Neue';font-size:34px;line-height:1;color:var(--accent);display:flex;align-items:center;gap:7px;min-width:0;}
.ko-summary-card.champion strong{font-family:inherit;font-size:15px;font-weight:900;line-height:1.25;color:var(--text);}
.ko-summary-card em{font-style:normal;font-size:11px;color:var(--text2);font-weight:700;line-height:1.35;display:flex;align-items:center;gap:5px;min-width:0;}
.ko-nav-spacer{display:none;}

async function fetchGitHubContentsJson(url){
  const metaRes=await fetch(url,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
  if(!metaRes.ok)throw new Error(`HTTP ${metaRes.status}`);
  const meta=await metaRes.json();
  let content=meta.content;
  if((!content||meta.encoding==='none')&&meta.git_url){
    const blobRes=await fetch(meta.git_url,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
    if(!blobRes.ok)throw new Error(`HTTP ${blobRes.status}`);
    const blob=await blobRes.json();
    content=blob.content;
  }
  if(!content)throw new Error('GitHub players.generated.json content is empty');
  return JSON.parse(decodeBase64Text(content));
}

async function fetchSharedRoomPayload(roomCode){

function applySharedRoomPayload(payload){
  const normalized=normalizeSharedRoomPayload(payload,payload?.room?.code);
  const rooms=[...gs('rooms',[])];
  const roomIndex=rooms.findIndex(r=>r.id===normalized.room.id||normalizeRoomCode(r.code)===normalized.room.code);
  if(roomIndex>=0)rooms[roomIndex]=normalized.room;else rooms.push(normalized.room);
  ss('rooms',rooms);
  const users=[...gs('users',[])];
  normalized.users.forEach((nextUser)=>{
    const index=users.findIndex(u=>u.id===nextUser.id);
    if(index>=0)users[index]={...users[index],...nextUser};else users.push(nextUser);
  });
  ss('users',users);
  ss(roomDataKey(normalized.room.id,PREDICTION_STORE_KEY),normalized.state.predictionsV2||{});

function reconcileCurrentUserWithSharedRoom(payload){
  const normalized=normalizeSharedRoomPayload(payload,payload?.room?.code);
  const current=gs('currentUser',null);
  if(!current?.id||current?.isGuest)return {payload:normalized,user:current,changed:false,saveRequired:false};
  const currentCode=localRoomCodeForId(current.roomId);
  if(currentCode&&currentCode!==normalized.room.code)return {payload:normalized,user:current,changed:false,saveRequired:false};
  const currentMemberCode=String(current.memberCode||'').trim().toUpperCase();
  let matched=normalized.users.find(u=>u.id===current.id)
    || (currentMemberCode?normalized.users.find(u=>String(u.memberCode||'').trim().toUpperCase()===currentMemberCode):null);
  if(matched){
    const nextUser={...matched,username:current.username||matched.username,roomId:normalized.room.id};
    normalized.users=normalized.users.map(u=>u.id===matched.id?nextUser:u);
    const missingMember=!normalized.room.members.includes(nextUser.id);
    if(missingMember)normalized.room.members.push(nextUser.id);
    const changed=current.id!==nextUser.id||current.roomId!==nextUser.roomId||current.username!==nextUser.username;
    return {payload:normalized,user:nextUser,changed,saveRequired:changed||missingMember};
  }
  if(normalized.room.members.length>=(normalized.room.maxMembers||2)){
    return {payload:normalized,user:current,changed:false,saveRequired:false};
  }
  const nextUser={...current,roomId:normalized.room.id};
  normalized.users.push(nextUser);
  normalized.room.members.push(nextUser.id);
  return {payload:normalized,user:nextUser,changed:current.roomId!==nextUser.roomId,saveRequired:true};
}

async function syncStaticSharedRoomState(roomId,mutator){

  return saved;
}

function genCode(){return Math.random().toString(36).substring(2,8).toUpperCase();}

function calcPoints(preds,results,userId,settings){
  return calcPointSummary(preds,results,userId,settings).total;
}
function calcPointSummary(preds,results,userId,settings){
  const {resultPts=1,exactPts=1}=settings||{};
  let total=0;
  let resultHits=0;
  let exactHits=0;
  let resultPoints=0;
  let exactPoints=0;
  const up=preds[userId]||{};
  Object.entries(results).forEach(([mid,res])=>{
    const p=up[mid];if(!p)return;
    if(p.home===res.home&&p.away===res.away){
      total+=resultPts+exactPts;
      resultHits+=1;
      exactHits+=1;
      resultPoints+=resultPts;
      exactPoints+=exactPts;
      return;
    }
    const pr=p.home>p.away?'H':p.home<p.away?'A':'D';
    const rr=res.home>res.away?'H':res.home<res.away?'A':'D';
    if(pr===rr){total+=resultPts;resultHits+=1;resultPoints+=resultPts;}
  });
  return {total,resultHits,exactHits,resultPoints,exactPoints,resultPts,exactPts};
}
function calcGroupStandings(teams,results,groupId){
  const gm=GROUP_MATCHES.filter(m=>m.groupId===groupId);
  const st={};teams.forEach(t=>{st[t]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};});
  gm.forEach(m=>{
    const r=results[m.id];if(!r)return;
    st[m.home].p++;st[m.away].p++;
    st[m.home].gf+=r.home;st[m.home].ga+=r.away;
    st[m.away].gf+=r.away;st[m.away].ga+=r.home;
    if(r.home>r.away){st[m.home].w++;st[m.home].pts+=3;st[m.away].l++;}
    else if(r.home<r.away){st[m.away].w++;st[m.away].pts+=3;st[m.home].l++;}
    else{st[m.home].d++;st[m.home].pts++;st[m.away].d++;st[m.away].pts++;}
  });
  return teams.map(t=>({name:t,...st[t]})).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||b.w-a.w);
}
function groupMatches(groupId){
  return GROUP_MATCHES.filter(m=>m.groupId===groupId);
}
function isGroupComplete(groupId,results={}){
  const gm=groupMatches(groupId);
  return gm.length>0&&gm.every(m=>!!results[m.id]);
}
function maxGroupPoints(team,groupId,results={}){
  const group=GROUPS_RAW.find(g=>g.id===groupId);
  if(!group)return 0;
  const standings=calcGroupStandings(group.teams,results,groupId);
  const current=standings.find(t=>t.name===team)?.pts||0;
  const remaining=groupMatches(groupId).filter(m=>!results[m.id]&&(m.home===team||m.away===team)).length;
  return current+remaining*3;
}
function calcGroupQualificationMeta(groupId,results={}){
  const group=GROUPS_RAW.find(g=>g.id===groupId);
  if(!group)return {};
  const complete=isGroupComplete(groupId,results);
  const standings=calcGroupStandings(group.teams,results,groupId);
  const meta={};
  standings.forEach((team,index)=>{
    const threats=standings.filter(other=>other.name!==team.name&&maxGroupPoints(other.name,groupId,results)>=team.pts).length;
    const rankConfirmed=complete&&index<2?index+1:null;
    meta[team.name]={
      qualified:index<2&&(complete||threats<2),
      rankConfirmed,
    };
  });
  return meta;
}
function groupSeedTeam(seedLabel,results={}){
  const seed=koSeedLabel(seedLabel);
  const match=seed.match(/^([A-L])組([12])位$/);
  if(!match)return null;
  const desiredRank=Number(match[2]);
  const meta=calcGroupQualificationMeta(match[1],results);
  return Object.entries(meta).find(([,value])=>value.rankConfirmed===desiredRank)?.[0]||null;
}
function koSeedRank(seedLabel){
  const seed=koSeedLabel(seedLabel);
  const match=seed.match(/^([A-L])組([123])位$/);
  if(match)return Number(match[2]);
  return seed.includes('組3位')?3:null;
}
function calcFixtureQualificationMeta(koFixtures={}){
  const meta={};
  const round=koGetRound('R32');
  (round?.matches||[]).forEach((match)=>{
    ['home','away'].forEach((side)=>{
      const team=koFixtures?.[match.id]?.[side];
      if(!team||!TEAM_JA[team])return;
      meta[team]={qualified:true,rank:koSeedRank(match[side])};
    });
  });
  return meta;
}
function calcKoPointSummary(koPreds,results,userId,settings){
  const {
    koWinnerPts=1,
    koExactPts=1,
    koPenaltyPts=0,
    koChampionPts=3,
    koRunnerUpPts=2,
    koThirdPlacePts=1,
    koRunnerUpEnabled=true,
    koThirdPlaceEnabled=true,
  }=settings||{};
  const userPreds=koPreds?.[userId]||{};
  let total=0,winnerHits=0,exactHits=0,penaltyHits=0,championHit=0,runnerUpHit=0,thirdPlaceHit=0;
  KO_MATCHES.forEach((match)=>{
    const pred=normalizeKoRecord(userPreds[match.id]);
    const actual=normalizeKoRecord(results?.[match.id]);
    if(!pred||!actual)return;
    const predWinner=koRecordWinnerSide(pred);
    const actualWinner=koRecordWinnerSide(actual);
    if(predWinner&&actualWinner&&predWinner===actualWinner){
      total+=koWinnerPts;winnerHits+=1;
    }
    if(koRecordScoreExact(pred,actual)){
      total+=koExactPts;exactHits+=1;
    }
    if(actual.decidedBy==='PK'&&pred.decidedBy==='PK'&&predWinner&&actualWinner&&predWinner===actualWinner){
      total+=koPenaltyPts;penaltyHits+=1;
    }
  });
  const predPodium=koPodiumPredictions(userPreds,{});
  const actualPodium=koActualPodium(results);
  if(predPodium.champion&&actualPodium.champion&&koSeedLabel(predPodium.champion)===koSeedLabel(actualPodium.champion)){
    total+=koChampionPts;championHit=1;
  }
  if(koRunnerUpEnabled&&predPodium.runnerUp&&actualPodium.runnerUp&&koSeedLabel(predPodium.runnerUp)===koSeedLabel(actualPodium.runnerUp)){
    total+=koRunnerUpPts;runnerUpHit=1;
  }
  if(koThirdPlaceEnabled&&predPodium.third&&actualPodium.third&&koSeedLabel(predPodium.third)===koSeedLabel(actualPodium.third)){
    total+=koThirdPlacePts;thirdPlaceHit=1;
  }
  return {total,winnerHits,exactHits,penaltyHits,championHit,runnerUpHit,thirdPlaceHit,koWinnerPts,koExactPts,koPenaltyPts,koChampionPts,koRunnerUpPts,koThirdPlacePts};
}
const SCORER_PREDICTION_SLOTS=[
  {key:'first',label:'得点ランキング 1位的中',pickLabel:'1位予想',pointsKey:'scorerFirstPts',hitKey:'firstHit',pointsResultKey:'firstPoints',defaultPoints:3},
  {key:'second',label:'得点ランキング 2位的中',pickLabel:'2位予想',pointsKey:'scorerSecondPts',hitKey:'secondHit',pointsResultKey:'secondPoints',defaultPoints:2},
  {key:'third',label:'得点ランキング 3位的中',pickLabel:'3位予想',pointsKey:'scorerThirdPts',hitKey:'thirdHit',pointsResultKey:'thirdPoints',defaultPoints:1},
];
const TOTAL_PREDICTABLE_ITEMS=GROUP_MATCHES.length+KO_MATCHES.length+SCORER_PREDICTION_SLOTS.length;
function scorerPlayerKey(player){
  if(!player)return '';
  const country=String(player.country||'').trim();
  const id=String(player.id||'').trim();
  return country&&id?`${country}::${id}`:'';
}
function normalizeScorerPredictionValue(value){
  if(!value)return '';
  if(typeof value==='string')return value;
  if(typeof value==='object'){
    const country=String(value.country||'').trim();
    const id=String(value.playerId||value.id||'').trim();
    return country&&id?`${country}::${id}`:'';
  }
  return '';
}
function scorerStatNumber(value,fallback=0){
  const num=Number(value);
  return Number.isFinite(num)?num:fallback;
}
function scorerMinutes(player){
  for(const key of ['worldCupMinutes','worldCupMinutesPlayed','minutesPlayed','minutes']){
    const num=Number(player?.[key]);
    if(Number.isFinite(num)&&num>=0)return num;
  }
  return null;
}
function compareScorerPlayers(a,b){
  const goalDiff=scorerStatNumber(b?.worldCupGoals)-scorerStatNumber(a?.worldCupGoals);
  if(goalDiff)return goalDiff;
  const assistDiff=scorerStatNumber(b?.worldCupAssists)-scorerStatNumber(a?.worldCupAssists);
  if(assistDiff)return assistDiff;
  const aMinutes=scorerMinutes(a), bMinutes=scorerMinutes(b);
  if(aMinutes!==null&&bMinutes!==null&&aMinutes!==bMinutes)return aMinutes-bMinutes;
  return scorerPlayerKey(a).localeCompare(scorerPlayerKey(b));
}
function sameScorerRankBucket(a,b){
  if(scorerStatNumber(a?.worldCupGoals)!==scorerStatNumber(b?.worldCupGoals))return false;
  return true;
}
function makeScorerRankGroups(players=ALL_PLAYERS,limit=Infinity){
  const groups=[];
  const sorted=[...(players||[])]
    .filter((player)=>Number(player?.worldCupGoals||0)>0&&scorerPlayerKey(player))
    .sort(compareScorerPlayers);
  sorted.forEach((player)=>{
    let group=groups[groups.length-1];
    if(!group||!sameScorerRankBucket(group.players[0],player)){
      if(groups.length>=limit)return;
      group={
        rank:groups.length+1,
        goals:scorerStatNumber(player.worldCupGoals),
        assists:scorerStatNumber(player.worldCupAssists),
        minutes:scorerMinutes(player),
        players:[],
        keys:new Set()
      };
      groups.push(group);
    }
    group.players.push(player);
    group.keys.add(scorerPlayerKey(player));
  });
  return groups;
}
function buildScorerRankGroups(players=ALL_PLAYERS){
  return makeScorerRankGroups(players,SCORER_PREDICTION_SLOTS.length);
}
function buildScorerRankingRows(players=ALL_PLAYERS){
  return makeScorerRankGroups(players).flatMap((group)=>group.players.map((player)=>({
    ...player,
    rank:group.rank,
    isTied:group.players.length>1,
    scorerRankGroupSize:group.players.length,
  })));
}
function scorerPredictionCount(userScorerPreds={}){
  return SCORER_PREDICTION_SLOTS.reduce((count,slot)=>count+(normalizeScorerPredictionValue(userScorerPreds?.[slot.key])?1:0),0);
}
function isScorerResultFinalized(results={}){return !!normalizeKoRecord(results?.['F-0']);}
function calcScorerPointSummary(scorerPreds,userId,settings,players=ALL_PLAYERS,results=undefined){
  const userPreds=scorerPreds?.[userId]||{};
  const groups=buildScorerRankGroups(players);
  const result={
    total:0,
    firstHit:0,
    secondHit:0,
    thirdHit:0,
    firstPoints:0,
    secondPoints:0,
    thirdPoints:0,
    scorerFirstPts:Number(settings?.scorerFirstPts??3),
    scorerSecondPts:Number(settings?.scorerSecondPts??2),
    scorerThirdPts:Number(settings?.scorerThirdPts??1),
  };
  if(results!==undefined&&!isScorerResultFinalized(results))return result;
  SCORER_PREDICTION_SLOTS.forEach((slot,index)=>{
    const predicted=normalizeScorerPredictionValue(userPreds[slot.key]);
    const actualGroup=groups[index];
    const pts=Number(settings?.[slot.pointsKey]??slot.defaultPoints);
    result[slot.pointsResultKey]=0;
    if(predicted&&actualGroup?.keys?.has(predicted)){
      result[slot.hitKey]=1;
      result[slot.pointsResultKey]=pts;
      result.total+=pts;
    }
  });
  return result;
}
function displayUserLabel(user,roomOrMembers){
  if(!user)return '--';
  return user.username || '--';
}
