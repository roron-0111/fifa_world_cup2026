function AuthScreen({onAuth}){
  const lang=useContext(LangCtx);const l=T[lang];
  const lastAuth=gs('lastAuthUser',null);
  const authProfiles=gs('authProfiles',{})||{};
  const [form,setForm]=useState(()=>({username:lastAuth?.username||'',roomCode:lastAuth?.roomCode||''}));
  const [err,setErr]=useState('');
  const recentProfiles=Object.values(authProfiles)
    .filter((profile)=>profile?.roomCode&&profile?.username)
    .reduce((acc,profile)=>{
      if(!acc.some((item)=>item.roomCode===profile.roomCode&&item.username===profile.username))acc.push(profile);
      return acc;
    },[])
    .slice(0,2);
  const set=k=>e=>setForm(f=>({...f,[k]:e.target.value}));
  function useRecentProfile(profile){
    setForm({
      username:profile.username||'',
      roomCode:profile.roomCode||'',
    });
    setErr('');
  }

  function startGuestMode(){
    const guestRoomId='room-guest-local';
    const guestUserId='guest-local';
    const guestRoomCode='GUEST';
    const rooms=[...gs('rooms',[])];
    let room=rooms.find(r=>r.id===guestRoomId);
    if(!room){
      room={id:guestRoomId,code:guestRoomCode,members:[guestUserId],maxMembers:1};
      rooms.push(room);
    }else{
      room={...room,members:[guestUserId],maxMembers:1};
      const idx=rooms.findIndex(r=>r.id===guestRoomId);
      rooms[idx]=room;
    }
    ss('rooms',rooms);
    const users=[...gs('users',[])];
    const guest={id:guestUserId,username:'ゲスト',memberCode:'GUEST',roomId:guestRoomId,isGuest:true};
    const existingIdx=users.findIndex(u=>u.id===guestUserId);
    if(existingIdx>=0)users[existingIdx]=guest;else users.push(guest);
    ss('users',users);
    ss('currentUser',guest);
    onAuth(guest);
  }

  async function submit(){
    setErr('');
    const rawName=form.username.trim();
    if(!rawName){setErr('ユーザー名を入力してください');return;}
    const roomCodeInput=form.roomCode.trim().toUpperCase();
    const profileKey=roomCodeInput?`${roomCodeInput}::${rawName.toLowerCase()}`:'';
    const savedProfile=profileKey?authProfiles[profileKey]||null:null;
    const canReuse=!!savedProfile;
    if(HAS_BACKEND){
      const result=await api('/api/auth/join',{
        username:rawName,
        roomCode:form.roomCode.trim(),
        memberCode:canReuse?savedProfile?.memberCode||'':'',
        userId:canReuse?savedProfile?.id||'':'',
      });
      if(!result?.ok){
        setErr(result?.error||'参加できませんでした');
        return;
      }
      ss('rooms',result.rooms||[]);
      ss('users',result.users||[]);
      if(result.room?.state){
        const state=result.room.state;
        ss(roomDataKey(result.room.id,PREDICTION_STORE_KEY),state.predictionsV2||state.predictions||{});
        ss(roomDataKey(result.room.id,'results'),state.results||{});
        ss(roomDataKey(result.room.id,'koFixtures'),state.koFixtures||{});
        ss(roomDataKey(result.room.id,'locked'),state.locked||{});
        ss(roomDataKey(result.room.id,'koPreds'),state.koPreds||{});
        ss(roomDataKey(result.room.id,'scorerPreds'),state.scorerPreds||{});
        ss(roomDataKey(result.room.id,'settings'),state.settings||DEFAULT_ROOM_SETTINGS);
      }
      const persisted={
        id:result.user.id,
        username:result.user.username,
        memberCode:result.user.memberCode,
        roomId:result.user.roomId,
        roomCode:result.room?.code||form.roomCode.trim().toUpperCase(),
      };
      const nextProfiles={...authProfiles,[`${persisted.roomCode}::${String(persisted.username||'').toLowerCase()}`]:persisted};
      ss('lastAuthUser',persisted);
      ss('authProfiles',nextProfiles);
      ss('currentUser',result.user);
      onAuth(result.user);
      return;
    }
    if(STATIC_SHARED_ROOM_BACKEND){
      const code=normalizeRoomCode(form.roomCode)||genCode();
      try{
        const shared=normalizeSharedRoomPayload(await fetchSharedRoomPayload(code),code);
        const reuseMemberCode=canReuse?String(savedProfile?.memberCode||'').trim().toUpperCase():'';
        const existing=(reuseMemberCode&&shared.users.find(u=>String(u.memberCode||'').toUpperCase()===reuseMemberCode&&u.roomId===shared.room.id))||findUniqueRoomUserByName(shared.users,shared.room.id,rawName)||null;
        if(shared.room.members.length>=shared.room.maxMembers&&!existing){setErr('このルームは満員です');return;}
        let user=existing||null;
        if(user){
          user={...user,username:rawName,roomId:shared.room.id};
          shared.users=shared.users.map(u=>u.id===user.id?user:u);
          if(!shared.room.members.includes(user.id))shared.room.members.push(user.id);
        }else{
          let memberCode;
          do{
            memberCode=Math.random().toString(36).slice(2,6).toUpperCase();
          }while(shared.users.some(u=>String(u.memberCode||'').toUpperCase()===memberCode));
          user={id:'u-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),username:rawName,memberCode,roomId:shared.room.id};
          shared.users.push(user);
          shared.room.members.push(user.id);
        }
        const saved=await saveSharedRoomPayload(shared);
        applySharedRoomPayload(saved);
        const cu={...user,roomId:saved.room.id};
        const persisted={id:cu.id,username:cu.username,memberCode:cu.memberCode,roomId:cu.roomId,roomCode:saved.room.code};
        ss('lastAuthUser',persisted);
        ss('authProfiles',{...authProfiles,[`${saved.room.code}::${String(cu.username||'').toLowerCase()}`]:persisted});
        ss('currentUser',cu);onAuth(cu);
        return;
      }catch(error){
        setErr(error?.message||'共有ルームへ接続できませんでした');
        return;
      }
    }
    const code=(form.roomCode.trim().toUpperCase()||genCode());
    const rooms=[...gs('rooms',[])];
    let room=rooms.find(r=>r.code===code);
    if(!room){
      room={id:'room-'+Date.now(),code,members:[],maxMembers:2};
      rooms.push(room);
    }
    const users=[...gs('users',[])];
    const reuseMemberCode=canReuse?String(savedProfile?.memberCode||'').trim().toUpperCase():'';
    const existing=
      (reuseMemberCode&&users.find(u=>u.memberCode===reuseMemberCode&&u.roomId===room.id))||findUniqueRoomUserByName(users,room.id,rawName)||null;
    if(room.members.length>=2&&!existing){setErr('このルームは満員です');return;}
    let user=existing||null;
    if(user){
      user.username=rawName;
      user.roomId=room.id;
      if(!room.members.includes(user.id))room.members.push(user.id);
    }else{
      let memberCode;
      do{
        memberCode=Math.random().toString(36).slice(2,6).toUpperCase();
      }while(users.some(u=>u.memberCode===memberCode));
      user={id:'u-'+Date.now(),username:rawName,memberCode,roomId:room.id};
      users.push(user);
      if(!room.members.includes(user.id))room.members.push(user.id);
    }
    ss('rooms',rooms);
    ss('users',users);
    const cu={...user,roomId:room.id};
    const persisted={id:cu.id,username:cu.username,memberCode:cu.memberCode,roomId:cu.roomId,roomCode:room.code};
    ss('lastAuthUser',persisted);
    ss('authProfiles',{...authProfiles,[`${room.code}::${String(cu.username||'').toLowerCase()}`]:persisted});
    ss('currentUser',cu);onAuth(cu);
  }

  return(
    <div className="auth-bg">
      <div className="auth-top-title">FIFA WORLD CUP 2026</div>
      <div className="auth-hero">
        <div className="auth-brand">
          <img className="auth-logo-art" src="./WorldCup_logo.png?v=20260419_234500" alt="FIFA WORLD CUP 2026" />
          <div className="auth-overlay messi" aria-hidden="true"></div>
          <div className="auth-overlay haaland" aria-hidden="true"></div>
        </div>
      </div>
      <div className="auth-card">
        <div className="field"><label>ユーザー名</label>
          <input value={form.username} onChange={set('username')} placeholder="例: YAMADA" maxLength={16}/>
        </div>
        <div className="field"><label>ルームコード</label>
          <input value={form.roomCode} onChange={set('roomCode')} placeholder="FIFA26" maxLength={12} style={{letterSpacing:'3px',fontWeight:800,fontSize:18}}/>
        </div>
        {recentProfiles.length>0&&(
          <div className="auth-recent">
            <div className="auth-recent-title">過去に参加したルーム情報</div>
            <div className="auth-recent-list">
              {recentProfiles.map((profile)=>(
                <button className="auth-recent-btn" key={`${profile.roomCode}-${profile.username}`} type="button" onClick={()=>useRecentProfile(profile)}>
                  <strong>ユーザー名：{profile.username}</strong>
                  <span>ルームコード：{profile.roomCode}</span>
                </button>
              ))}
            </div>
          </div>
        )}
        <p style={{fontSize:12,color:'var(--text2)',marginBottom:12,lineHeight:1.6}}>1ルーム2人まで入室可。友達同士で試合予想をしよう！</p>
        {err&&<div className="errmsg">{err}</div>}
        <button className="btn" style={{marginTop:12}} onClick={submit}>
          ルームに参加 / 作成
        </button>
        <button className="btn ghost" style={{marginTop:10}} onClick={startGuestMode}>
          ゲストで見る
        </button>
        <div className="guest-help">ゲストは閲覧専用です。予想入力・保存はできません。</div>
      </div>
    </div>
  );
}

// ===== HOME =====
function HomeScreen({user,onLogout,syncToken}){
  const lang=useContext(LangCtx);const l=T[lang];
  const [copied,setCopied]=useState(false);
  const [homeToast,setHomeToast]=useState('');
  const [homeUpdatingResults,setHomeUpdatingResults]=useState(false);
  const rooms=gs('rooms',[]);
  const room=rooms.find(r=>r.id===user.roomId);
  const roomId=room?.id||user.roomId;
  const preds=grPred(roomId,{});
  const results=gr(roomId,'results',{});
  const koFixtures=gr(roomId,'koFixtures',{});
  const koPreds=gr(roomId,'koPreds',{});
  const scorerPreds=gr(roomId,'scorerPreds',{});
  const settings={...DEFAULT_ROOM_SETTINGS,...gr(roomId,'settings',{})};
  const mySummary=calcPointSummary(preds,results,user.id,settings);
  const myKoSummary=calcKoPointSummary(koPreds,results,user.id,settings);
  const myScorerSummary=calcScorerPointSummary(scorerPreds,user.id,settings,ALL_PLAYERS,results);
  const users=gs('users',[]);
  const roomUsers=(() => {
    const byId=new Map();
    users.filter((u)=>u.roomId===roomId).forEach((u)=>byId.set(u.id,u));
    (room?.members||[])
      .map((id)=>users.find((u)=>u.id===id))
      .filter(Boolean)
      .forEach((u)=>byId.set(u.id,u));
    if(!byId.size&&user?.roomId===roomId)byId.set(user.id,user);
    return [...byId.values()];
  })();
  const roomMembers=roomUsers.length?roomUsers:[user];
  const opp=roomMembers.find((m)=>m.id!==user.id)||null;
  const oppId=opp?.id||null;
  const oppSummary=oppId?calcPointSummary(preds,results,oppId,settings):{total:0,resultHits:0,exactHits:0};
  const oppKoSummary=oppId?calcKoPointSummary(koPreds,results,oppId,settings):{total:0,winnerHits:0,exactHits:0};
  const oppScorerSummary=oppId?calcScorerPointSummary(scorerPreds,oppId,settings,ALL_PLAYERS,results):calcScorerPointSummary({},'',settings,ALL_PLAYERS,results);
  const myGroupPredCount=Object.keys(preds[user.id]||{}).length;
  const myKoPredCount=koMatchPredictionCount(koPreds[user.id]||{});
  const myScorerPredCount=scorerPredictionCount(scorerPreds[user.id]||{});
  const myPredCount=myGroupPredCount+myKoPredCount+myScorerPredCount;
  const resultCount=Object.keys(results).length;
  const myLabel=displayUserLabel(user,roomMembers);
  const oppLabel=displayUserLabel(opp,roomMembers);
  const myTotal=mySummary.total+myKoSummary.total+myScorerSummary.total;
  const oppTotal=oppSummary.total+oppKoSummary.total+oppScorerSummary.total;
  const oppGroupPredCount=oppId?Object.keys(preds[oppId]||{}).length:0;
  const oppKoPredCount=oppId?koMatchPredictionCount(koPreds[oppId]||{}):0;
  const oppScorerPredCount=oppId?scorerPredictionCount(scorerPreds[oppId]||{}):0;
  const oppPredCount=oppGroupPredCount+oppKoPredCount+oppScorerPredCount;
  const myUnpredictedCount=TOTAL_PREDICTABLE_ITEMS-myPredCount;
  const oppUnpredictedCount=oppId?TOTAL_PREDICTABLE_ITEMS-oppPredCount:0;
  const groupCompareRows=[
    {label:'勝敗的中',me:`${mySummary.resultHits}件 / +${mySummary.resultPoints}pt`,opp:`${oppSummary.resultHits||0}件 / +${oppSummary.resultPoints||0}pt`},
    {label:'スコア的中',me:`${mySummary.exactHits}件 / +${mySummary.exactPoints}pt`,opp:`${oppSummary.exactHits||0}件 / +${oppSummary.exactPoints||0}pt`},

  const koWinnerPts=(summary)=>`${summary.winnerHits||0}件 / +${(summary.winnerHits||0)*(summary.koWinnerPts||0)}pt`;

function PredictionPointTag({score}){
  if(!score)return null;
  const type=score.type==='exact'?'exact':score.type==='result'?'result':'miss';
  const label=score.type==='exact'?`⭐ +${score.pts}pt`:score.type==='result'?`✓ +${score.pts}pt`:'✗ +0';
  return <div className={`prediction-point-tag ${type}`}>{label}</div>;
}

// ===== MATCH CARD =====
function MatchCard({match,userId,opponentId,preds,results,onSave,roomId,syncToken,readOnly=false}){
  const lang=useContext(LangCtx);const l=T[lang];
  const users=gs('users',[]);
  const myPred=preds[userId]?.[match.id];
  const oppPred=opponentId?preds[opponentId]?.[match.id]:null;
  const result=results[match.id];
  const isFinished=!!result;
  const isPredictionClosed=isMatchPredictionClosed(match);
  const isPredictionReadOnly=readOnly||isFinished||isPredictionClosed;
  const uiSettings=gs('settings',DEFAULT_UI_SETTINGS);
  const timeZone=uiSettings.timeZone||DEFAULT_UI_SETTINGS.timeZone;
  const locked=gr(roomId,'locked',{});
  const isLocked=(locked[userId]||[]).includes(match.id);
  const [home,setHome]=useState(myPred?.home??0);
  const [away,setAway]=useState(myPred?.away??0);
  const scoreDraftRef=useRef({home:myPred?.home??0,away:myPred?.away??0});
  const [localLocked,setLocalLocked]=useState(isLocked&&!!myPred);
  const myUserName=users.find((u)=>u.id===userId)?.username||'ユーザー名';
  const oppUserName=users.find((u)=>u.id===opponentId)?.username||'ユーザー名';
  const showTeam=t=>t.startsWith('TBD-')?placeholderLabel(t):teamJa(t);

  useEffect(()=>{
    setHome(myPred?.home??0);
    setAway(myPred?.away??0);
    scoreDraftRef.current={home:myPred?.home??0,away:myPred?.away??0};
    setLocalLocked(isLocked&&!!myPred);
  },[syncToken,myPred?.home,myPred?.away,isLocked,match.id]);

  function updateScore(side,delta){
    if(isPredictionReadOnly||localLocked||isMatchPredictionClosed(match))return;
    const current=scoreDraftRef.current;
    const nextValue=Math.max(0,Math.min(20,(current[side]||0)+delta));
    scoreDraftRef.current={...current,[side]:nextValue};
    if(side==='home')setHome(nextValue);else setAway(nextValue);
  }
  function doConfirm(){
    if(readOnly||isFinished||isMatchPredictionClosed(match))return;
    const prediction={...scoreDraftRef.current};
    onSave(match.id,prediction,true);
    saveAndLockGroupPrediction(roomId,userId,match.id,prediction);
    setLocalLocked(true);
  }
  function doUnlock(){
    if(readOnly||isFinished||isMatchPredictionClosed(match))return;
    const lk=gr(roomId,'locked',{});
    lk[userId]=(lk[userId]||[]).filter(id=>id!==match.id);
    sr(roomId,'locked',lk);
    setLocalLocked(false);
  }
  function getPts(pred,res){
    if(!pred||!res)return null;
    const s={...DEFAULT_ROOM_SETTINGS,...gr(roomId,'settings',{})};
    if(pred.home===res.home&&pred.away===res.away)return{pts:s.resultPts+s.exactPts,type:'exact'};
    const pr=pred.home>pred.away?'H':pred.home<pred.away?'A':'D';
    const rr=res.home>res.away?'H':res.home<res.away?'A':'D';
    return pr===rr?{pts:s.resultPts,type:'result'}:{pts:0,type:'miss'};
  }
  const myScore=myPred&&result?getPts(myPred,result):null;
  const oppScore=oppPred&&result?getPts(oppPred,result):null;
  const groupJudgment=getGroupJudgment(myPred,result);
  return(
    <div className="mcard">
      <div className="mcard-hdr">
        <span>グループ {match.groupId}</span>
        <div className="mcard-hdr-right">
          {result?
            <span className="match-finished-tag">終了</span>
            :<>
              {isPredictionClosed
                ?<span className="lock-tag">締切</span>
                :localLocked&&<span className="lock-tag">🔒 {l.confirm}済み</span>}
              <span className={`match-status-badge ${groupJudgment.state}`}>{isPredictionClosed?'締切':groupJudgment.label}</span>
            </>}
        </div>
      </div>
      <div style={{padding:'7px 12px 0',fontSize:10,color:'var(--text2)',fontWeight:700,display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
        <span>{formatMatchDate(match.date,match.kickoff,timeZone)}</span>
        <span>{stadiumLabel(match.stadium,lang)}</span>
      </div>
      <div className="mcard-body">
        <div className="mteams">
          <div className="mt"><span className="fl"><TeamFlag team={match.home}/></span><div className="nm">{showTeam(match.home)}</div></div>
          <div className="result-display">
            <span className="result-score">{result?.home??'?'}</span>
            <span className="result-dash">–</span>
            <span className="result-score">{result?.away??'?'}</span>
          </div>
          <div className="mt"><span className="fl"><TeamFlag team={match.away}/></span><div className="nm">{showTeam(match.away)}</div></div>
        </div>
        <div className="pred-compare">
          <div className="pred-box me">
            <div className="pred-head">
              <span className="pred-role">自分</span>
              <div className="pred-name">{myUserName}</div>
            </div>
            {(localLocked||isPredictionReadOnly)
              ?<div className="pred-score">
                <div>
                  <div className={`pred-value big${myPred?'':' no-pred'}`}>{scorePairText(myPred,l.noPred)}</div>
                </div>
                <PredictionPointTag score={myScore}/>
              </div>
              :<div className="pred-edit">
                <div className="scw">
                  <button className="sarr" onClick={()=>updateScore('home',1)}>▲</button>
                  <div className={`snum${home>0?' active':''}`}>{home}</div>
                  <button className="sarr" onClick={()=>updateScore('home',-1)}>▼</button>
                </div>
                <div className="sdiv">–</div>
                <div className="scw">
                  <button className="sarr" onClick={()=>updateScore('away',1)}>▲</button>
                  <div className={`snum${away>0?' active':''}`}>{away}</div>
                  <button className="sarr" onClick={()=>updateScore('away',-1)}>▼</button>
                </div>
              </div>
            }
          </div>
          <div className="pred-box opp">
            <div className="pred-head">
              <span className="pred-role">相手</span>
              <div className="pred-name">{oppUserName}</div>
            </div>
            <div className="pred-score">
              <div>
                <div className={`pred-value${oppPred?'':' no-pred'}`}>{scorePairText(oppPred,'未予想')}</div>
              </div>
              <PredictionPointTag score={oppScore}/>
            </div>
          </div>
        </div>
        <div className="mactions">
          {isFinished
            ?null
            :readOnly
            ?<div className="readonly-note">ゲスト閲覧中のため予想入力はできません</div>
            :isPredictionClosed
            ?<div className="readonly-note">試合開始後のため予想は変更できません</div>
            :localLocked
            ?<button className="ubtn" onClick={doUnlock}>🔓 {l.unlock}</button>
            :<button className="pbtn" onClick={doConfirm}>{l.confirm}</button>
          }
        </div>
      </div>
    </div>
  );
}

function BracketScreen({user,syncToken}){
  const lang=useContext(LangCtx);const l=T[lang];
  const rooms=gs('rooms',[]);
  const room=rooms.find(r=>r.id===user.roomId);
  const roomId=room?.id||user.roomId;
  const users=gs('users',[]);
  const roomUsers=(() => {
    const byId=new Map();
    users.filter((u)=>u.roomId===roomId).forEach((u)=>byId.set(u.id,u));
    (room?.members||[])
      .map((id)=>users.find((u)=>u.id===id))
      .filter(Boolean)
      .forEach((u)=>byId.set(u.id,u));
    if(!byId.size&&user?.roomId===roomId)byId.set(user.id,user);
    return [...byId.values()];
  })();
  const roomMembers=roomUsers.length?roomUsers:[user];
  const opp=roomMembers.find((m)=>m.id!==user.id)||null;
  const oppId=opp?.id||null;
  const [koPreds,setKoPreds]=useState(()=>gr(roomId,'koPreds',{}));
  const [results,setResults]=useState(()=>gr(roomId,'results',{}));
  const [koFixtures,setKoFixtures]=useState(()=>gr(roomId,'koFixtures',{}));
  const [editing,setEditing]=useState(null);
  const [draft,setDraft]=useState(null);
  const [status,setStatus]=useState('');
  const scrollRef=useRef(null);
  const scrollProxyRef=useRef(null);
  const labelScrollRef=useRef(null);
  const stickyStageRef=useRef(null);
  const [stickyHeight,setStickyHeight]=useState(0);
  const KO_VIEW_SEQUENCE=['normal','minimal','compact'];
  const KO_VIEW_ZOOMS={normal:0.8,minimal:0.4,compact:0.6};
  const KO_VIEW_LABELS={normal:'40%へ',minimal:'60%へ',compact:'80%へ'};
  function normalizeKoViewMode(mode){return KO_VIEW_SEQUENCE.includes(mode)?mode:'normal';}
  const [viewMode,setViewMode]=useState(()=>normalizeKoViewMode(gs('koViewMode','normal')));
  const uiSettings=gs('settings',DEFAULT_UI_SETTINGS);
  const timeZone=uiSettings.timeZone||DEFAULT_UI_SETTINGS.timeZone;
  const myPreds=koPreds[user.id]||{};
  const oppPreds=oppId?(koPreds[oppId]||{}):{};
  const canEditKo=!user.isGuest;
  const settings={...DEFAULT_ROOM_SETTINGS,...gr(roomId,'settings',{})};
  const boardRounds=KO_ROUNDS.filter((round)=>['R32','R16','QF','SF','F'].includes(round.id));
  const BOARD={x:24,y:50,w:260,h:136,gapX:314,gapY:156};
  const R32_VISUAL_ORDER=[1,4,0,2,10,11,8,9,3,5,6,7,13,15,12,14];
  const R32_VISUAL_SLOT=R32_VISUAL_ORDER.reduce((acc,index,slot)=>({...acc,[index]:slot}),{});
  const BOARD_WIDTH=BOARD.x+BOARD.gapX*5+BOARD.w+190;
  const BOARD_BOTTOM_PADDING=20;
  const BOARD_MAX_R32_SLOT=Math.max(...Object.values(R32_VISUAL_SLOT));
  const BOARD_HEIGHT=BOARD.y+BOARD.gapY*BOARD_MAX_R32_SLOT+BOARD.h+BOARD_BOTTOM_PADDING;
  const canvasZoom=KO_VIEW_ZOOMS[viewMode]||0.8;
  const podium=koPodiumPredictions(myPreds,{},koFixtures);
  const oppPodium=oppId?koPodiumPredictions(oppPreds,{},koFixtures):{};
  const podiumCandidates=koPodiumCandidates(myPreds,results,koFixtures);
  const champion=podium.champion;

  useEffect(()=>{
    setKoPreds(gr(roomId,'koPreds',{}));
    setResults(gr(roomId,'results',{}));
    setKoFixtures(gr(roomId,'koFixtures',{}));
  },[syncToken,roomId]);
  useEffect(()=>{
    const measure=()=>setStickyHeight(Math.ceil(stickyStageRef.current?.getBoundingClientRect().height||0));
    measure();
    const raf=requestAnimationFrame(measure);
    window.addEventListener('resize',measure);
    const observer=window.ResizeObserver&&stickyStageRef.current?new ResizeObserver(measure):null;
    if(observer&&stickyStageRef.current)observer.observe(stickyStageRef.current);
    return()=>{
      cancelAnimationFrame(raf);
      window.removeEventListener('resize',measure);
      observer?.disconnect();
    };
  },[]);

  function roundX(roundId){
    if(roundId==='3RD')return BOARD.x + 4 * BOARD.gapX;
    const index=['R32','R16','QF','SF','F'].indexOf(roundId);
    return BOARD.x + Math.max(0,index) * BOARD.gapX;
  }
  function centerY(roundId,index){
    if(roundId==='3RD')return centerY('F',0) + BOARD.h + 24;
    if(roundId==='R32')return BOARD.y + (R32_VISUAL_SLOT[index]??index)*BOARD.gapY + BOARD.h/2;
    const homeRef=koSourceRef(roundId,index,'home');
    const awayRef=koSourceRef(roundId,index,'away');
    if(!homeRef||!awayRef)return BOARD.y + BOARD.h/2;
    const a=centerY(homeRef.round,homeRef.index);
    const b=centerY(awayRef.round,awayRef.index);
    return (a+b)/2;
  }
  function cardY(roundId,index){return centerY(roundId,index)-BOARD.h/2;}
  function routeY(roundId,index,side){
    const base=centerY(roundId,index);
    if(side==='home')return base-BOARD.h*0.2;
    if(side==='away')return base+BOARD.h*0.2;
    return base;
  }
  function syncBracketScroll(source){
    const scroller=scrollRef.current;
    const proxy=scrollProxyRef.current;
    const labels=labelScrollRef.current;
    if(!scroller||!proxy)return;
    if(source==='proxy'){
      if(Math.abs(scroller.scrollLeft-proxy.scrollLeft)>1)scroller.scrollLeft=proxy.scrollLeft;
    }else{
      if(Math.abs(proxy.scrollLeft-scroller.scrollLeft)>1)proxy.scrollLeft=scroller.scrollLeft;
    }
    const left=source==='proxy'?proxy.scrollLeft:scroller.scrollLeft;
    if(labels&&Math.abs(labels.scrollLeft-left)>1)labels.scrollLeft=left;
  }
  function podiumPickLabel(value){
    return value?koTeamName(value):'未選択';
  }
  function matchPoints(match,predsForUser=myPreds){
    const pred=normalizeKoRecord(predsForUser[match.id]);
    const actual=normalizeKoRecord(results[match.id]);
    if(!pred||!actual)return null;
    let pts=0;
    const pw=koRecordWinnerSide(pred), aw=koRecordWinnerSide(actual);
    if(pw&&aw&&pw===aw)pts+=settings.koWinnerPts||0;
    if(koRecordScoreExact(pred,actual))pts+=settings.koExactPts||0;
    if(actual.decidedBy==='PK'&&pred.decidedBy==='PK'&&pw&&aw&&pw===aw)pts+=settings.koPenaltyPts||0;
    return pts;
  }
  function buildDraft(match){
    const current=normalizeKoRecord(myPreds[match.id])||{};
    const inferred=current.winnerSide||inferWinnerSide(current.home,current.away)||'home';
    return {
      home:String(current.home??0),
      away:String(current.away??0),
      winnerSide:inferred,
      decidedBy:current.decidedBy==='PK'?'PK':'REG',
      homePen:String(current.homePen??0),
      awayPen:String(current.awayPen??0),
    };
  }
  function koModalTeamValue(side){
    if(!editing)return '';
    return koOfficialResolvedTeam(editing.roundId,editing.index,side,results,koFixtures)||editing.match[side];
  }
  function koModalTeamLabel(side){
    return koTeamName(koModalTeamValue(side));
  }
  function koDraftScoreWinner(){
    if(!draft)return null;
    const home=Math.max(0,Number(draft.home)||0);
    const away=Math.max(0,Number(draft.away)||0);
    return inferWinnerSide(home,away);
  }
  function koDraftScoresTied(){
    if(!draft)return false;
    const home=Math.max(0,Number(draft.home)||0);
    const away=Math.max(0,Number(draft.away)||0);
    return home===away;
  }
  function updateDraftScore(side,value){
    const next={...draft,[side]:value};
    const home=Math.max(0,Number(next.home)||0);
    const away=Math.max(0,Number(next.away)||0);
    const scoreWinner=inferWinnerSide(home,away);
    setDraft({...next,winnerSide:scoreWinner||next.winnerSide||'home',decidedBy:scoreWinner?'REG':next.decidedBy});
  }
  function adjustDraftScore(side,delta){
    const current=Math.max(0,Number(draft?.[side])||0);
    updateDraftScore(side,String(Math.max(0,current+delta)));
  }
  function openMatch(round,index){
    const match=round.matches[index];
    if(!canEditKo||normalizeKoRecord(results[match.id])||isMatchPredictionClosed(match))return;
    setEditing({roundId:round.id,index,match});
    setDraft(buildDraft(match));
    setStatus('');
  }
  function saveDraft(){
    if(!editing||!draft||!canEditKo)return;
    if(normalizeKoRecord(results[editing.match.id])||isMatchPredictionClosed(editing.match)){setStatus('試合開始後のため予想は変更できません');return;}
    const home=Math.max(0,Number(draft.home)||0);
    const away=Math.max(0,Number(draft.away)||0);
    const tied=home===away;
    const wantsPk=tied&&draft.decidedBy==='PK';
    const homePen=wantsPk?Math.max(0,Number(draft.homePen)||0):null;
    const awayPen=wantsPk?Math.max(0,Number(draft.awayPen)||0):null;
    const scoreWinner=inferWinnerSide(home,away);
    const pkWinner=wantsPk?inferWinnerSide(homePen,awayPen):null;
    const winnerSide=scoreWinner||pkWinner;
    if(tied&&draft.decidedBy!=='PK'){setStatus('同点の場合はPK戦で決着にチェックしてください');return;}
    if(wantsPk&&!pkWinner){setStatus('PKの得点差がつくように入力してください');return;}
    const record={
      home,away,
      winnerSide,
      decidedBy:wantsPk?'PK':'REG',
      homePen,awayPen,
      locked:true,
      updatedAt:new Date().toISOString(),
    };
    const next={...koPreds,[user.id]:{...myPreds,[editing.match.id]:record}};
    setKoPreds(next);sr(roomId,'koPreds',next);
    setEditing(null);setDraft(null);setStatus('');
  }
  function clearDraft(){
    if(!editing||!canEditKo)return;
    if(normalizeKoRecord(results[editing.match.id])||isMatchPredictionClosed(editing.match)){setStatus('試合開始後のため予想は変更できません');return;}
    const userKo={...(koPreds[user.id]||{})};
    delete userKo[editing.match.id];
    const next={...koPreds,[user.id]:userKo};
    setKoPreds(next);sr(roomId,'koPreds',next);
    setEditing(null);setDraft(null);setStatus('');
  }
  function updatePodium(key,value){
    if(!canEditKo||isKoPodiumPredictionClosed(key))return;
    const nextUserPreds={...myPreds,_podium:{...(myPreds._podium||{}),[key]:value}};
    if(!value)delete nextUserPreds._podium[key];
    const next={...koPreds,[user.id]:nextUserPreds};
    setKoPreds(next);sr(roomId,'koPreds',next);
  }
  function updateViewMode(mode){
    setViewMode(mode);
    ss('koViewMode',mode);
    requestAnimationFrame(()=>syncBracketScroll('board'));
  }
  function toggleViewMode(){
    const currentIndex=KO_VIEW_SEQUENCE.indexOf(viewMode);
    updateViewMode(KO_VIEW_SEQUENCE[(currentIndex+1)%KO_VIEW_SEQUENCE.length]);
  }
  function renderLines(){
    const lines=[];
    ['R16','QF','SF','F'].forEach((roundId)=>{
      const round=koGetRound(roundId);
      round.matches.forEach((match,index)=>{
        const homeRef=koSourceRef(roundId,index,'home');
        const awayRef=koSourceRef(roundId,index,'away');
        if(!homeRef||!awayRef)return;
        const x1=roundX(homeRef.round)+BOARD.w;
        const x2=roundX(roundId);
        const mid=x1+(x2-x1)/2;
        const yHome=centerY(homeRef.round,homeRef.index);
        const yAway=centerY(awayRef.round,awayRef.index);
        const yTarget=centerY(roundId,index);
        const homeWinner=koOfficialWinnerSideForMatch(koGetMatch(homeRef.round,homeRef.index),results);
        const awayWinner=koOfficialWinnerSideForMatch(koGetMatch(awayRef.round,awayRef.index),results);
        const baseD=`M ${x1} ${yHome} H ${mid} M ${x1} ${yAway} H ${mid} M ${mid} ${yHome} V ${yAway}`;
        const targetD=`M ${mid} ${yTarget} H ${x2}`;
        lines.push(<path key={`${roundId}-${index}`} className="ko-line" d={`${baseD} ${targetD}`}/>);
        const addActiveBranch=(key,ySource)=>{
          const branchD=`M ${x1} ${ySource} H ${mid} M ${mid} ${ySource} V ${yTarget} ${targetD}`;
          lines.push(<path key={key} className="ko-line on" d={branchD}/>);
        };
        if(homeWinner)addActiveBranch(`${roundId}-${index}-home-on`,yHome);
        if(awayWinner)addActiveBranch(`${roundId}-${index}-away-on`,yAway);
      });
    });
    const finalMatch=koGetMatch('F',0);
    const finalWinner=koOfficialWinnerSideForMatch(finalMatch,results);
    const finalX=roundX('F')+BOARD.w;
    const finalY=finalWinner?routeY('F',0,finalWinner):centerY('F',0);
    lines.push(<path key="champion-line" className={`ko-line champion${finalWinner?' on':''}`} d={`M ${finalX} ${finalY} H ${finalX+150}`}/>);
    return lines;
  }
  function renderTeamBlock(roundId,index,side,label,winnerSide){
    const isWinner=winnerSide===side;
    return(
      <div className={`ko-team-block${isWinner?' win':''}`} key={side}>
        <span className="ko-team-flag"><TeamFlag team={label}/></span>
        <span className="ko-team-name">{koTeamName(label)}</span>
        {isWinner&&<span className="ko-win-mark">勝</span>}
      </div>
    );
  }
  function renderActualScore(record){
    return (
      <div className={`ko-actual-score${record?' on':''}`}>
        {record?koRecordScoreText(record):'VS'}
      </div>
    );
  }
  function renderPredictionLine(kind,label,record,pts=null){
    return(
      <div className={`ko-pred-line ${kind}`} key={kind}>
        <b>{label}</b>
        <strong>{koRecordScoreText(record)}</strong>
        {pts!==null&&<em>+{pts}pt</em>}
      </div>
    );
  }
  function renderRoundLabels(){
    return [
      {id:'R32',label:'R32'},
      {id:'R16',label:'R16'},
      {id:'QF',label:'準々決勝'},
      {id:'SF',label:'準決勝'},
      {id:'F',label:'決勝',final:true},
    ].map((round)=>(
      <div
        key={`round-label-${round.id}`}
        className={`ko-round-label${round.final?' final':''}`}
        style={{left:roundX(round.id),width:BOARD.w}}
      >
        <span>{round.label}</span>
        {round.sub&&<small>{round.sub}</small>}
      </div>
    ));
  }
  function renderStickyRoundBand(){
    return (
      <div className="ko-round-band" ref={labelScrollRef}>
        <div className="ko-round-band-inner" style={{width:BOARD_WIDTH*canvasZoom}}>
          {[
            {id:'R32',label:'R32'},
            {id:'R16',label:'R16'},
            {id:'QF',label:'準々決勝'},
            {id:'SF',label:'準決勝'},
            {id:'F',label:'決勝',sub:'3位決定戦は直下',final:true},
          ].map((round)=>(
            <div
              key={`sticky-round-label-${round.id}`}
              className={`ko-round-band-label${round.final?' final':''}`}
              style={{left:roundX(round.id)*canvasZoom,width:BOARD.w*canvasZoom}}
            >
              <span>{round.label}</span>
              {round.sub&&<small>{round.sub}</small>}
            </div>
          ))}
        </div>
      </div>
    );
  }
  function renderRoundGuides(){
    return ['R32','R16','QF','SF','F'].map((roundId)=>(
      <div
        key={`round-guide-${roundId}`}
        className="ko-round-guide"
        style={{left:roundX(roundId)+BOARD.w/2}}
      ></div>
    ));
  }
  function renderMatch(round,index){
    const match=round.matches[index];
    const actual=normalizeKoRecord(results[match.id]);
    const isPredictionClosed=isMatchPredictionClosed(match);
    const pred=normalizeKoRecord(myPreds[match.id]);
    const oppPred=oppId?normalizeKoRecord(oppPreds[match.id]):null;
    const winnerSide=koRecordWinnerSide(actual);
    const homeLabel=koOfficialResolvedTeam(round.id,index,'home',results,koFixtures)||match.home;
    const awayLabel=koOfficialResolvedTeam(round.id,index,'away',results,koFixtures)||match.away;
    const pts=matchPoints(match,myPreds);
    const oppPts=oppId?matchPoints(match,oppPreds):null;
    const koJudgment=getKoJudgment(pred,actual);
    const matchKindLabel=round.id==='F'?'決勝':round.id==='3RD'?'3位決定戦':'';
    const canEditMatch=canEditKo&&!actual&&!isPredictionClosed;
    return(
      <button
        key={match.id}
        className={`ko-match-node ${round.id.toLowerCase()}${round.id==='3RD'?' third-place':''}${actual?' actual':pred?' predicted':''}${canEditMatch?'':' readonly'}`}
        style={{left:roundX(round.id),top:cardY(round.id,index),width:BOARD.w,height:BOARD.h}}
        onClick={()=>openMatch(round,index)}
        disabled={!canEditMatch}
      >
        <div className="ko-match-meta">
          <div className="ko-match-meta-main">
            {matchKindLabel&&<span className={`ko-match-kind${round.id==='3RD'?' third':''}`}>{matchKindLabel}</span>}
            <span className="ko-match-time">
              <b>{match.matchNo?`M${match.matchNo}`:'MATCH'}</b>
              <small>{formatMatchDate(match.date,match.kickoff,timeZone)}</small>
            </span>
            <em className="ko-match-stadium">{stadiumLabel(match.stadium,lang)}</em>
          </div>
          <span className={`ko-match-status ${koJudgment.state}`}>{!actual&&isPredictionClosed?'締切':koJudgment.label}</span>
        </div>
        <div className="ko-teams-line">
          {renderTeamBlock(round.id,index,'home',homeLabel,winnerSide)}
          {renderActualScore(actual)}
          {renderTeamBlock(round.id,index,'away',awayLabel,winnerSide)}
        </div>
        <div className="ko-score-stack">
          {renderPredictionLine('me','自分',pred,pts)}
          {renderPredictionLine('opp','相手',oppId?oppPred:null,oppPts)}
        </div>
      </button>
    );
  }

  return(
    <div className="page ko-page">
      <div className="ko-nav-spacer" aria-hidden="true"></div>
      <div className="ko-sticky-stage" ref={stickyStageRef}>
        <div className="ko-podium-panel">
          <div className="ko-podium-grid">
            {[
              {key:'champion',label:'優勝予想',enabled:true,points:settings.koChampionPts},
              {key:'runnerUp',label:'2位予想',enabled:settings.koRunnerUpEnabled,points:settings.koRunnerUpPts},
              {key:'third',label:'3位予想',enabled:settings.koThirdPlaceEnabled,points:settings.koThirdPlacePts},
            ].map(item=>{
              const isPodiumClosed=isKoPodiumPredictionClosed(item.key);
              return (
                <div className={`ko-podium-pick${item.enabled?'':' off'}`} key={item.key}>
                  <div className="ko-podium-label"><span>{item.label}</span></div>
                  <select
                    value={podium[item.key]||''}
                    disabled={!item.enabled||!canEditKo||isPodiumClosed}
                    onChange={(e)=>updatePodium(item.key,e.target.value)}
                  >
                    <option value="">{item.enabled?'未選択':'設定で無効'}</option>
                    {podiumCandidates.map(candidate=><option key={`${item.key}-${candidate}`} value={candidate}>{koTeamName(candidate)}</option>)}
                  </select>
                  <div className="ko-podium-opp"><b>相手</b><span>{oppId?podiumPickLabel(oppPodium[item.key]):'-'}</span></div>
                  <div className="ko-podium-note">{!item.enabled?'採点しない場合はこのままでOK':isPodiumClosed?'予想締切済み':canEditKo?`${koPodiumDeadlineLabel(item.key)} / 的中で +${item.points}pt`:'ゲストは閲覧のみ'}</div>
                </div>
              );
            })}
          </div>
        </div>
        {renderStickyRoundBand()}
      </div>
      <div className="ko-sticky-spacer" style={{height:stickyHeight}} aria-hidden="true"></div>
      <button className="ko-zoom-toggle" onClick={toggleViewMode} aria-label="決勝トーナメント表示倍率を3段階で切り替え">{KO_VIEW_LABELS[viewMode]||'40%へ'}</button>
      <div className="ko-scroll" ref={scrollRef} onScroll={()=>syncBracketScroll('board')}>
        <div className="ko-canvas" style={{width:BOARD_WIDTH,height:BOARD_HEIGHT,zoom:canvasZoom}}>
          {renderRoundGuides()}
          <svg className="ko-lines" width="100%" height="100%" viewBox={`0 0 ${BOARD_WIDTH} ${BOARD_HEIGHT}`} preserveAspectRatio="none">
            {renderLines()}
          </svg>
          {renderRoundLabels()}
          {boardRounds.map((round)=>round.matches.map((m,i)=>renderMatch(round,i)))}
          {KO_ROUNDS.find(r=>r.id==='3RD').matches.map((m,i)=>renderMatch(KO_ROUNDS.find(r=>r.id==='3RD'),i))}
          <div className={`ko-champion-node${champion?' on':''}`} style={{left:roundX('F')+BOARD.w+124,top:centerY('F',0)-54}}>
            <span>優勝</span>
            <strong>{champion?<><TeamFlag team={champion}/> {koTeamName(champion)}</>:'未定'}</strong>
          </div>
        </div>
      </div>
      {ReactDOM.createPortal(
        <div className="ko-scrollbar-proxy" ref={scrollProxyRef} onScroll={()=>syncBracketScroll('proxy')} aria-label="決勝トーナメント表の横スクロール">
          <div style={{width:BOARD_WIDTH*canvasZoom,height:1}}></div>
        </div>,
        document.body
      )}
      {editing&&draft&&(
        <div className="ko-modal-backdrop" onClick={()=>setEditing(null)}>
          <div className="ko-modal" onClick={(e)=>e.stopPropagation()}>
            <div className="ko-modal-head">
              <div>
                <span>{koGetRound(editing.roundId)?.label} / {editing.match.id}</span>
                <h3>予想を入力</h3>
              </div>
              <button onClick={()=>setEditing(null)}>閉じる</button>
            </div>
            <div className="ko-modal-matchup">
              {['home','away'].map((side)=>(
                <React.Fragment key={side}>
                  {side==='away'&&<div className="ko-score-separator" aria-hidden="true">-</div>}
                  <div className={`ko-score-side ${side}`}>
                    <div className="ko-score-team">
                      <TeamFlag team={koModalTeamValue(side)}/>
                      <span className="ko-score-team-name">{koModalTeamLabel(side)}</span>
                    </div>
                    <div className="ko-score-stepper">
                      <button type="button" className="ko-score-step up" aria-label={`${koModalTeamLabel(side)}の得点を増やす`} onClick={()=>adjustDraftScore(side,1)}>+</button>
                      <input type="number" min="0" inputMode="numeric" value={draft[side]} onChange={(e)=>updateDraftScore(side,e.target.value)}/>
                      <button type="button" className="ko-score-step down" aria-label={`${koModalTeamLabel(side)}の得点を減らす`} onClick={()=>adjustDraftScore(side,-1)}>-</button>
                    </div>
                  </div>
                </React.Fragment>
              ))}
            </div>
            <div className={`ko-winner-preview ${koDraftScoreWinner()?'':'placeholder'}`}>
              {koDraftScoreWinner()?<>勝者: <b>{koModalTeamLabel(koDraftScoreWinner())}</b></>:<span aria-hidden="true">&nbsp;</span>}
            </div>
            <label className={`ko-pk-toggle ${koDraftScoresTied()?'':'disabled'}`}>
              <input type="checkbox" checked={draft.decidedBy==='PK'} disabled={!koDraftScoresTied()} onChange={(e)=>setDraft({...draft,decidedBy:e.target.checked?'PK':'REG'})}/>
              PK戦で決着
            </label>
            {koDraftScoresTied()&&draft.decidedBy==='PK'&&(
              <div className="ko-score-editor pk">
                <input type="number" min="0" value={draft.homePen} onChange={(e)=>setDraft({...draft,homePen:e.target.value})}/>
                <span>PK</span>
                <input type="number" min="0" value={draft.awayPen} onChange={(e)=>setDraft({...draft,awayPen:e.target.value})}/>
              </div>
            )}
            {status&&<div className="errmsg">{status}</div>}
            <div className="ko-modal-actions">
              <button className="ghost" onClick={clearDraft}>クリア</button>
              <button className="primary" onClick={saveDraft}>保存</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ===== LEADERBOARD =====
function LeaderboardScreen({user,onOpenTeam,syncToken}){
  const lang=useContext(LangCtx);const l=T[lang];
  const players=[...ALL_PLAYERS];
  const rankedScorerRows=buildScorerRankingRows(players);
  const top=rankedScorerRows[0]||null;
  const rooms=gs('rooms',[]);
  const room=rooms.find(r=>r.id===user.roomId);
  const roomId=room?.id||user.roomId;
  const settings={...DEFAULT_ROOM_SETTINGS,...gr(roomId,'settings',{})};
  const users=gs('users',[]);
  const roomMembers=(room?.members||[]).map(id=>users.find(u=>u.id===id)).filter(Boolean);
  const opp=roomMembers.find((m)=>m.id!==user.id)||null;
  const oppId=opp?.id||null;
  const [scorerPreds,setScorerPreds]=useState(()=>gr(roomId,'scorerPreds',{}));
  const [scorerCountryFilters,setScorerCountryFilters]=useState({});
  const [scorerRefreshing,setScorerRefreshing]=useState(false);
  const [scorerToast,setScorerToast]=useState('');
  const results=gr(roomId,'results',{});
  useEffect(()=>{setScorerPreds(gr(roomId,'scorerPreds',{}));},[syncToken,roomId,user.id]);
  const myScorerPreds=scorerPreds[user.id]||{};
  const oppScorerPreds=oppId?(scorerPreds[oppId]||{}):{};
  const myScorerPredCount=scorerPredictionCount(myScorerPreds);
  const oppScorerPredCount=oppId?scorerPredictionCount(oppScorerPreds):0;
  const scorerSummary=calcScorerPointSummary(scorerPreds,user.id,settings,ALL_PLAYERS,results);
  const countryOptions=Object.keys(PLAYER_DATA).sort((a,b)=>teamJa(a).localeCompare(teamJa(b),'ja'));
  const playerByScorerKey=Object.fromEntries(ALL_PLAYERS.map((player)=>[scorerPlayerKey(player),player]).filter(([key])=>key));
  const uiSettings=gs('settings',DEFAULT_UI_SETTINGS);
  const dataStamp=PLAYER_DATA_META.generatedAt ? formatTimestamp(PLAYER_DATA_META.generatedAt,uiSettings.timeZone) : '';
  const rankingStamp=PLAYER_DATA_META.meta?.worldFootballArchiveRankingUpdatedAt||'';
  const scorerUpdateStamp=dataStamp;
  const readOnly=!!user?.isGuest;
  const scorerPredictionClosed=isScorerPredictionClosed();

  function scorerPredictionLabel(playerKey){
    const player=playerByScorerKey[normalizeScorerPredictionValue(playerKey)];
    return player?playerDisplayName(player):'未選択';
  }
  function selectedCountryFor(slotKey){
    const selectedPlayer=playerByScorerKey[normalizeScorerPredictionValue(myScorerPreds[slotKey])];
    return scorerCountryFilters[slotKey] || selectedPlayer?.country || '';
  }
  function saveScorerPrediction(slotKey,playerKey){
    if(readOnly||isScorerPredictionClosed())return;
    const current=gr(roomId,'scorerPreds',{});
    const nextUser={...(current[user.id]||{})};
    if(playerKey)nextUser[slotKey]=playerKey;else delete nextUser[slotKey];
    const next={...current,[user.id]:nextUser};
    setScorerPreds(next);
    sr(roomId,'scorerPreds',next);
  }
  async function refreshScorerData(){
    const token=String(sessionStorage.getItem('wc26AdminToken')||DEFAULT_ADMIN_TOKEN).trim();
    sessionStorage.setItem('wc26AdminToken',token);
    const staticOnly=STATIC_SHARED_ROOM_BACKEND&&!HAS_BACKEND;
    const beforeGenerated=PLAYER_DATA_META.generatedAt||'';
    const beforeRanking=PLAYER_DATA_META.meta?.worldFootballArchiveRankingUpdatedAt||'';
    setScorerRefreshing(true);
    try{
      const res=staticOnly?await refreshStaticPlayerData():await api('/api/admin/refresh-players',{adminToken:token});
      if(!res?.ok){
        if(res?.dataStatus)setDataStatus(res.dataStatus);
        setScorerToast(res?.error||(HAS_BACKEND?'ローカルサーバーに接続できません。localhost:3000を起動してから再実行してください':'公開済みの得点ランキングデータを再読み込みできませんでした'));
        return;
      }
      const refreshed=setPlayerDataFromResponse(res,true);
      if(res.dataStatus)setDataStatus(res.dataStatus);
      if(staticOnly){
        const afterGenerated=res.generatedAt||'';
        const afterRanking=res.meta?.worldFootballArchiveRankingUpdatedAt||'';
        setScorerToast((afterGenerated&&afterGenerated!==beforeGenerated)||(afterRanking&&afterRanking!==beforeRanking)
          ?'公開済みの得点ランキングデータを再読み込みしました'
          :'公開済みの得点ランキングデータは変更ありません');
      }else{
        setScorerToast(refreshed?'得点ランキングデータを更新しました':'得点ランキングデータを取得できませんでした');
      }
    }catch(error){
      setScorerToast(error?.message||(staticOnly?'公開済みの得点ランキングデータを再読み込みできませんでした':'得点ランキングデータを取得できませんでした'));
    }finally{
      setScorerRefreshing(false);
    }
  }
  function renderScorerPick(slot){
    const selectedKey=normalizeScorerPredictionValue(myScorerPreds[slot.key]);
    const selectedCountry=selectedCountryFor(slot.key);
    const playersByCountry=PLAYER_DATA[selectedCountry]||[];
    const unavailableKeys=new Set(SCORER_PREDICTION_SLOTS
      .filter((other)=>other.key!==slot.key)
      .map((other)=>normalizeScorerPredictionValue(myScorerPreds[other.key]))
      .filter(Boolean));
    const hit=!!scorerSummary[slot.hitKey];
    return(
      <div className={`scorer-pred-card${hit?' hit':''}`} key={slot.key}>
        <div className="scorer-pred-head">
          <span>{slot.pickLabel}</span>
          <b>+{settings[slot.pointsKey]??slot.defaultPoints}pt</b>
        </div>
        <div className="scorer-pred-controls">
          <select
            className="scorer-select"
            value={selectedCountry}
            disabled={readOnly||scorerPredictionClosed}
            onChange={(e)=>{
              const country=e.target.value;
              setScorerCountryFilters({...scorerCountryFilters,[slot.key]:country});
              saveScorerPrediction(slot.key,'');
            }}
          >
            <option value="">国を選択</option>
            {countryOptions.map((country)=><option key={`${slot.key}-${country}`} value={country}>{teamJa(country)}</option>)}
          </select>
          <select
            className="scorer-select"
            value={selectedKey}
            disabled={readOnly||scorerPredictionClosed||!selectedCountry}
            onChange={(e)=>saveScorerPrediction(slot.key,e.target.value)}
          >
            <option value="">選手を選択</option>
            {playersByCountry.map((player)=>{
              const key=scorerPlayerKey(player);
              return <option key={`${slot.key}-${key}`} value={key} disabled={unavailableKeys.has(key)}>{playerDisplayName(player)}</option>;
            })}
          </select>
        </div>
        <div className="scorer-pred-note">
          <span>自分: {scorerPredictionLabel(selectedKey)}</span>
          <span>相手: {oppId?scorerPredictionLabel(oppScorerPreds[slot.key]):'-'}</span>
          <strong>{hit?'現在的中':'判定待ち'}</strong>
        </div>
      </div>
    );
  }

  return(
    <div className="page page-enter">
      {scorerToast&&<Toast msg={scorerToast} onDone={()=>setScorerToast('')}/>}
      <div className="shdr"><h2>得点ランキング</h2></div>
      <div className="lb-hero">
        <div className="lb-bg-txt">W杯</div>
        <div className="lb-vs-row" style={{gridTemplateColumns:'1fr'}}>
          <div className="lb-pl">
            <div className="lb-pl-name">トップスコアラー</div>
            <div className="lb-pl-pts">{top?.worldCupGoals??0}</div>
            {Number(top?.worldCupGoals||0)>0&&<div className="lb-top-player-name">{playerDisplayName(top)||''}</div>}
            {!top&&<div style={{fontSize:10,color:'rgba(255,255,255,.68)',marginTop:4}}>得点者はいません</div>}
          </div>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,margin:'12px 14px 0',padding:'10px 12px',background:'var(--s1)',border:'1px solid var(--border)',borderRadius:14,boxShadow:'var(--shadow)'}}>
        <div style={{minWidth:0}}>
          <div style={{fontSize:12,fontWeight:900,color:'var(--text)'}}>得点ランキングデータ</div>
          <div style={{fontSize:10,fontWeight:800,color:'var(--text2)',marginTop:2,lineHeight:1.35}}>
            <div>更新目安: 毎日12:00以降（日本時間）</div>
            {scorerUpdateStamp&&<div>最終更新: {scorerUpdateStamp}</div>}
          </div>
        </div>
        <button className="btn" style={{width:'auto',padding:'9px 13px',fontSize:12,whiteSpace:'nowrap',marginTop:0}} onClick={refreshScorerData} disabled={scorerRefreshing}>
          {scorerRefreshing?'更新中…':(HAS_BACKEND?'最新を反映':'最新データを確認')}
        </button>
      </div>
      <div className="scorer-data-note">※提供元データが未更新の場合は、最新を確認しても表示は変わりません。</div>
      <details className="scorer-pred-panel">
        <summary className="scorer-pred-summary">
          <div className="scorer-pred-summary-title">
            <strong>得点ランキング予想</strong>
            <span>一覧を見ながら必要な時だけ入力</span>
          </div>
          <div className="scorer-pred-counts">
            <span>自分 <b>{myScorerPredCount}/3</b></span>
            <span>相手 <b>{oppId?`${oppScorerPredCount}/3`:'-'}</b></span>
          </div>
          <span className="scorer-pred-caret" aria-hidden="true"></span>
        </summary>
        <div className="scorer-pred-body">
          <div className="scorer-pred-grid">
            {SCORER_PREDICTION_SLOTS.map(renderScorerPick)}
          </div>
          <div className="scorer-pred-help">
            {scorerPredictionClosed?'予想締切済み':'予想期限: 決勝開始まで'}。同率の場合は同じ得点数の選手全員をその順位の正解扱いにします。得点数そのものは予想対象ではありません。
          </div>
        </div>
      </details>
      <div className="rank-meta" style={{paddingTop:10}}>
        <span>表示 {rankedScorerRows.length} 人</span>
        <span>2026ワールドカップ得点順</span>
      </div>
      <div className="section-title">選手一覧</div>
      <div className="rank-list">
        {rankedScorerRows.length===0&&<div style={{padding:24,textAlign:'center',color:'var(--text2)',fontSize:13,fontWeight:800}}>得点者はいません</div>}
        {rankedScorerRows.map((row)=>(
          <div className="rank-card" key={row.id}>
            <div className="rank-card-top">
              <div className="rank-card-left">
                <div className="rank-card-rank">{row.isTied?`同率${row.rank}位`:`${row.rank}位`}</div>
                <div className="rank-card-name">{playerDisplayName(row)}</div>
                <div className="rank-card-meta">
                  <span className={`rank-pos ${positionClass(row.position)}`}>{positionJa(row.position)}</span>
                  <span>{row.countryJa||teamJa(row.country)}</span>
                  <span>{row.club||'Unknown'}</span>
                  {playerPhysicalMeta(row)&&<span>{playerPhysicalMeta(row)}</span>}
                  {Number(row.worldCupAssists||0)>0&&<span>アシスト {row.worldCupAssists}</span>}
                  {scorerMinutes(row)!==null&&<span>出場 {scorerMinutes(row)}分</span>}
                </div>
              </div>
              <div style={{textAlign:'right'}}>
                <div className="rank-score">{row.worldCupGoals??0}</div>
                <div className="rank-score-sub">得点</div>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div style={{height:20}}/>
    </div>
  );
}

  {id:'cream',color:'#f2ede4',label:'クリーム'},
  {id:'sky',color:'#e8f0fb',label:'スカイ'},
  {id:'sakura',color:'#fdf0f5',label:'さくら'},

function SettingsScreen({user,syncToken,onRenameUser}){

  const [uiSettings,setUiSettings]=useState(()=>gs('settings',DEFAULT_UI_SETTINGS));
  const [nameDraft,setNameDraft]=useState(user?.username||'');
  const [savingName,setSavingName]=useState(false);
  const [toast,setToast]=useState('');

  useEffect(()=>{
    setPointSettings({...DEFAULT_ROOM_SETTINGS,...gr(roomId,'settings',{})});
  },[syncToken,roomId]);
  useEffect(()=>{
    setNameDraft(user?.username||'');
  },[user?.id,user?.username]);

  function updUiSetting(k,v){
    const u={...uiSettings,[k]:v};
    setUiSettings(u);ss('settings',u);

          <div className="set-row">

            <div className="pts-ctrl">
              <button className="ptsbtn" onClick={()=>changePts('koPenaltyPts',-1)}>−</button>
              <div className="pts-val">{pointSettings.koPenaltyPts}</div>
              <button className="ptsbtn" onClick={()=>changePts('koPenaltyPts',1)}>+</button>
            </div>
          </div>
          <div className="set-row">
            <div className="sl">優勝的中<span>決勝の勝者が実際の優勝国と一致した場合</span></div>
            <div className="pts-ctrl">
              <button className="ptsbtn" onClick={()=>changePts('koChampionPts',-1)}>−</button>
              <div className="pts-val">{pointSettings.koChampionPts}</div>
              <button className="ptsbtn" onClick={()=>changePts('koChampionPts',1)}>+</button>

          <div className="set-row">
            <div className="sl">2位予想を採点<span>不要な場合はオフ。優勝のみのルールにできます。</span></div>

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "blue",
  "bgTheme": "cream"
}/*EDITMODE-END*/;

function TweaksPanel(){
  const lang=useContext(LangCtx);
  const [t,setT]=useState(()=>({...TWEAK_DEFAULTS,...gs('tweaks',{})}));
  function set(k,v){
    const n={...t,[k]:v};setT(n);ss('tweaks',n);
    if(k==='accentColor'){applyAccent(v);window.parent.postMessage({type:'__edit_mode_set_keys',edits:{accentColor:v}},'*');}
    if(k==='bgTheme'){applyTheme(v);}
  }
  const accents=[{id:'blue',label:'ブルー'},{id:'red',label:'レッド'},{id:'purple',label:'パープル'},{id:'teal',label:'ティール'},{id:'orange',label:'オレンジ'}];
  return(
    <div className="tweaks-panel">
      <h4>⚡ Tweaks</h4>
      <div className="tw-row">
        <span className="tw-lbl">アクセント</span>

          {accents.map(a=><button key={a.id} className={`tw-opt${t.accentColor===a.id?' on':''}`} onClick={()=>set('accentColor',a.id)}>{a.label}</button>)}

}

// ===== APP =====
function App(){
  const [user,setUser]=useState(()=>gs('currentUser',null));
  const [screen,setScreen]=useState('home');
  const [tweaksOpen,setTweaksOpen]=useState(false);
  const [lang]=useState('ja');
  const [selectedTeam,setSelectedTeam]=useState(null);
  const [syncTick,setSyncTick]=useState(0);

  useEffect(()=>{
    const handler=e=>{
      if(e.data?.type==='__activate_edit_mode')setTweaksOpen(true);
      if(e.data?.type==='__deactivate_edit_mode')setTweaksOpen(false);
    };
    const syncHandler=()=>setSyncTick(t=>t+1);
    window.addEventListener('message',handler);
    window.addEventListener('wc26-sync',syncHandler);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    // Apply saved theme & accent
    const saved=gs('settings',DEFAULT_UI_SETTINGS);
    applyTheme(saved.bgTheme||'cream');
    applyAccent(saved.accentColor||'blue');
    return()=>{
      window.removeEventListener('message',handler);
      window.removeEventListener('wc26-sync',syncHandler);
    };
  },[]);

  useEffect(()=>{
    let alive=true;
    if(STATIC_SHARED_ROOM_BACKEND&&!HAS_BACKEND){
      refreshStaticPlayerData()
        .then((payload)=>{
          if(alive&&payload.dataStatus)setDataStatus(payload.dataStatus);
          if(alive)setSyncTick(t=>t+1);
        })
        .catch(()=>{});
    }
    return()=>{alive=false;};
  },[]);

  useEffect(()=>{
    refreshPlayerDataView();
    setSyncTick(t=>t+1);
  },[user?.roomId,user?.id]);

  async function syncCurrentRoom(options={}){
    const isAlive=options.isAlive||(()=>true);
    if(!user?.roomId||user?.isGuest)return {ok:false,error:'ログイン中のルームがありません'};
    try{
      if(STATIC_SHARED_ROOM_BACKEND&&!HAS_BACKEND){
        const code=localRoomCodeForId(user.roomId);
        if(!code)return {ok:false,error:'ルームコードが見つかりません'};
        const shared=await fetchSharedRoomPayload(code);
        if(!isAlive()||!shared)return {ok:false,error:'共有ルームを取得できませんでした'};
        const reconciled=reconcileCurrentUserWithSharedRoom(shared);
        const payloadToApply=reconciled.saveRequired?await saveSharedRoomPayload(reconciled.payload):reconciled.payload;
        applySharedRoomPayload(payloadToApply);
        if(reconciled.changed&&reconciled.user){
          ss('currentUser',reconciled.user);
          setUser(reconciled.user);
        }
        return {ok:true};
      }
      if(!HAS_BACKEND)return {ok:false,error:'共有同期は利用できません'};
      const res=await fetch(`/api/room/${encodeURIComponent(user.roomId)}`);
      if(!res.ok)return {ok:false,error:'ルーム情報を取得できませんでした'};
      const data=await res.json();
      if(!isAlive())return {ok:false,error:'更新を中断しました'};
      if(Array.isArray(data.rooms))ss('rooms',data.rooms);
      if(Array.isArray(data.users))ss('users',data.users);
      if(data.dataStatus)setDataStatus(data.dataStatus);
      if(data.resultStatus)RESULT_STATUS=data.resultStatus;
      setPlayerDataFromResponse(data,false);
      const roomState=data.room?.state||data.roomState;
      const roomId=data.room?.id||user.roomId;
      if(roomState){
        ss(roomDataKey(roomId,PREDICTION_STORE_KEY),roomState.predictionsV2||roomState.predictions||{});
        ss(roomDataKey(roomId,'results'),roomState.results||{});
        ss(roomDataKey(roomId,'koFixtures'),roomState.koFixtures||{});
        ss(roomDataKey(roomId,'locked'),roomState.locked||{});
        ss(roomDataKey(roomId,'koPreds'),roomState.koPreds||{});
        ss(roomDataKey(roomId,'scorerPreds'),roomState.scorerPreds||{});
        ss(roomDataKey(roomId,'settings'),roomState.settings||DEFAULT_ROOM_SETTINGS);
      }
      setSyncTick(t=>t+1);
      return {ok:true};
    }catch(error){
      return {ok:false,error:error?.message||'最新状態を取得できませんでした'};
    }
  }

  useEffect(()=>{
    if(!user?.roomId||user?.isGuest)return;
    let alive=true;
    syncCurrentRoom({isAlive:()=>alive});
    return()=>{alive=false;};
  },[user?.roomId]);

  function handleLogout(){
    const current=gs('currentUser',null);
    if(current?.isGuest){
      ss('currentUser',null);
      setUser(null);
      return;
    }
    if(current){
      ss('lastAuthUser',{id:current.id,username:current.username,memberCode:current.memberCode,roomId:current.roomId,roomCode:(gs('rooms',[]).find(r=>r.id===current.roomId)?.code)||''});
    }
    ss('currentUser',null);
    setUser(null);
  }

  async function handleRenameUser(nextUsername){
    const current=gs('currentUser',null);
    const nextName=String(nextUsername||'').trim();
    if(!current?.id) return {ok:false,error:'ユーザーが見つかりません'};
    if(!nextName) return {ok:false,error:'ユーザー名を入力してください'};
    if(String(current.username||'').trim()===nextName) return {ok:true,user:current};

    if(HAS_BACKEND&&!current.isGuest){
      const res=await api('/api/auth/rename',{roomId:current.roomId,userId:current.id,username:nextName});
      if(!res?.ok) return {ok:false,error:res?.error||'変更できませんでした'};
      if(Array.isArray(res.rooms))ss('rooms',res.rooms);
      if(Array.isArray(res.users))ss('users',res.users);
      const updated=res.user||{...current,username:nextName};
      updateLocalUserRecord(updated,current.username);
      setUser(updated);
      return {ok:true,user:updated};
    }

    const updated=updateLocalUserRecord({...current,username:nextName},current.username);
    setUser(updated);
    return {ok:true,user:updated};
  }

  if(!user){
    return(
      <LangCtx.Provider value={lang}>
        <div className="shell"><AuthScreen onAuth={u=>{setUser(u);}}/></div>
      </LangCtx.Provider>
    );
  }

  const rooms=gs('rooms',[]);
  const room=rooms.find(r=>r.id===user.roomId);

  const screens={
    home:<HomeScreen user={user} onLogout={handleLogout} syncToken={syncTick}/>,
    groups:<GroupsScreen user={user} onOpenTeam={setSelectedTeam} syncToken={syncTick}/>,
    bracket:<BracketScreen user={user} syncToken={syncTick}/>,
    leaderboard:<LeaderboardScreen user={user} onOpenTeam={setSelectedTeam} syncToken={syncTick}/>,
    settings:<SettingsScreen user={user} syncToken={syncTick} onRenameUser={handleRenameUser}/>,
  };

  return(
    <LangCtx.Provider value={lang}>
      <div className="shell">
        {screens[screen]}
        <BottomNav screen={screen} setScreen={setScreen}/>
        {tweaksOpen&&<TweaksPanel/>}
        {selectedTeam&&<CountryModal team={selectedTeam} onClose={()=>setSelectedTeam(null)}/>}
      </div>
    </LangCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
